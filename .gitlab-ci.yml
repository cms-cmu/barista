workflow:
  rules:
    # Do not run for tags
    - if: '$CI_COMMIT_TAG'
      when: never
    # Do not run for branches with 'test' in the name
    - if: '$CI_COMMIT_BRANCH =~ /test/'
      when: never
    # Run for master branch pushes/merges.  Must come BEFORE the markdown rule below:
    # `changes:` matches if ANY listed path changed (there is no "only these changed"
    # operator), so a master push touching one .md file would otherwise skip the whole
    # pipeline — including the `pages` job that publishes the docs site.
    - if: '$CI_COMMIT_BRANCH == "master"'
      variables:
        DEFAULT_ANALYSIS_IMAGE_TAG: "latest"
      when: always
    # Skip doc-only pushes on feature branches (see the caveat above: this fires whenever
    # a markdown file is among the changes, so keep it after the master rule)
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
      changes:
        - "**/*.md"
      when: never
    # Run for merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        DEFAULT_ANALYSIS_IMAGE_TAG: "latest"
        COFFEA4BEES_BRANCH: "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
        BBREWW_BRANCH: "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      when: always
    # Do not run push pipelines if there is an open merge request
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    # Run for pushes to feature branches (with or without open merge requests)
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
      variables:
        DEFAULT_ANALYSIS_IMAGE_TAG: "latest"
      when: always
    # Run for scheduled pipelines
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables:
        DEFAULT_ANALYSIS_IMAGE_TAG: "latest"
      when: always
    # Run for web-triggered pipelines
    - if: '$CI_PIPELINE_SOURCE == "web"'
      variables:
        DEFAULT_ANALYSIS_IMAGE_TAG: "latest"
      when: always

variables:
  # Trigger pipeline run for latest subproject commits
  CONTAINER_HOST: cms-cmu
  RECREATE_CONTAINERS: "false"
  DEFAULT_ANALYSIS_IMAGE_TAG: "latest"
  ANALYSIS_IMAGE_TAG: ${DEFAULT_ANALYSIS_IMAGE_TAG}
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: 1
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  BBREWW_BRANCH: '$CI_COMMIT_REF_NAME'
  COFFEA4BEES_BRANCH: '$CI_COMMIT_REF_NAME'
  MKDOCS_VERSION: '1.5.3'
  MATERIAL_VERSION: '9.5.3'
  RUN_PAGES: "false"  # Control whether to run the pages job
  DATASET: coffea4bees/metadata/datasets/
  CLASSIFIER_WFS: src/classifier/test/config/workflow/CI/

include:
  - local: 'software/dockerfiles/stages_build.yml'
  - local: 'src/workflows/gitlab-CI/stages_proxy.yml'
  - local: 'src/workflows/gitlab-CI/stages_code.yml'
  - local: 'src/workflows/gitlab-CI/stages_classifier.yml'
  - local: 'src/workflows/gitlab-CI/stages_skimmer.yml'
  - local: 'src/workflows/gitlab-CI/stages_friendtree.yml'
  - local: 'src/workflows/gitlab-CI/subprojects_base.yml'
  - project: 'authoring/documentation/mkdocs-ci'
    file: 'mkdocs-gitlab-pages.gitlab-ci.yml'

stages:  
  - build
  - setup
  - code 
  - classifier
  - skimmer
  - friendtree
  - analysis
  - tools
  - mixeddata
  - plot
  - cutflow
  - deploy
  - validation
  - workflows
  - mixeddata
  - pages

generate_subprojects_ci:
  stage: setup
  image: gitlab-registry.cern.ch/cms-cmu/barista:${ANALYSIS_IMAGE_TAG}
  needs: []
  script:
    - python3 src/tools/generate_subprojects_ci.py .subprojects-ci.yml
  artifacts:
    paths:
      - .subprojects-ci.yml
    expire_in: 1 day

subprojects_pipeline:
  stage: workflows
  needs:
    - generate_subprojects_ci
  trigger:
    include:
      - artifact: .subprojects-ci.yml
        job: generate_subprojects_ci
    strategy: depend
    forward:
      yaml_variables: true
      pipeline_variables: true

.base_analysis_barista:
  needs:
    - voms_proxy
    - job: build_container
      optional: true
      artifacts: true
  image: ${CI_REGISTRY_IMAGE}:${ANALYSIS_IMAGE_TAG}
  before_script:
    - echo "Add error handling flags"
    - set -e
    - set -o pipefail
    - export CONTAINER_PYTHON=$(which python)
    - export PATH="$PWD/.pixi-bin/bin:$PATH"
    - echo "Checking output directory"
    - ls $CI_PROJECT_PATH/output/ || true
    - echo "Setting analysis framework"
    - pwd && ls -la
  tags:
    - k8s-cvmfs
  retry: 2


validation:
  before_script:
    # The cupping notes are derived from roasts/*/roast.json and are not committed: a
    # generated index that every roast rewrites conflicts on each parallel publish.  Must
    # run before update_mkdocs_nav.sh, which globs docs/prod to build the nav.
    - python3 src/tools/roast.py index
    - bash docs/sync_readmes.sh
    - bash docs/update_mkdocs_nav.sh
    - cp docs/mkdocs.yml .
    - cp docs/requirements.txt .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - when: never

pages:
  # `pages` is the last stage, so without this it queues behind every analysis job and the
  # docs site only updates when the whole CI is green.  An empty `needs` starts it right
  # away, independent of the other stages: docs publish in a couple of minutes, and a
  # failure elsewhere in the pipeline no longer blocks them.
  needs: []
  before_script:
    # The cupping notes are derived from roasts/*/roast.json and are not committed: a
    # generated index that every roast rewrites conflicts on each parallel publish.  Must
    # run before update_mkdocs_nav.sh, which globs docs/prod to build the nav.
    - python3 src/tools/roast.py index
    - bash docs/sync_readmes.sh
    - bash docs/update_mkdocs_nav.sh
    - cp docs/mkdocs.yml .
    - cp docs/requirements.txt .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master")'
      when: always
    # Escape hatch: publish the docs from any pipeline (e.g. Run pipeline on master with
    # RUN_PAGES=true) without waiting for, or depending on, the analysis jobs.
    - if: '$RUN_PAGES == "true"'
      when: always
    - when: never
