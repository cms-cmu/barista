apiVersion: v1
kind: Pod
metadata:
  name: storage-helper
  namespace: cms-cmu
  labels:
    app: storage-helper
spec:
  restartPolicy: Always
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: NotIn
            values:
            - hcc-nrp-sec-c1109.unl.edu
            - hcc-chase-shor-c4705.unl.edu
            - hcc-chase-shor-c4715.unl.edu
            - hcc-chase-shor-c4719.unl.edu
            - hcc-nrp-shor-c5834.unl.edu
            - k8s-haosu-03.sdsc.optiputer.net
            - k8s-haosu-15.sdsc.optiputer.net
            - gpn-fiona-mizzou-9.rnet.missouri.edu
            - gpn-fiona-mizzou-8.rnet.missouri.edu
            - gpn-fiona-mizzou-7.rnet.missouri.edu
            - fiona.offn.oscer.ou.edu
  containers:
  - name: helper
    image: almalinux:9
    command: ["sleep", "infinity"]
    resources:
      limits:
        cpu: "4"
        memory: 8Gi
      requests:
        cpu: "1"
        memory: 2Gi
    volumeMounts:
    - mountPath: /workspace
      name: ceph-storage
  volumes:
  - name: ceph-storage
    persistentVolumeClaim:
      claimName: cms-cmu-storage
