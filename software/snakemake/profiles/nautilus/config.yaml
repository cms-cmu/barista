# Snakemake profile for classifier training and evaluation on NRP Nautilus Kubernetes.
# GPU rules (train, evaluate, or any rule with gres/gpus) are submitted as Kubernetes Jobs
# to the NRP Nautilus cluster using the shared CephFS volume.
# All other rules execute locally on the submit machine.
executor: cluster-generic
cluster-generic-submit-cmd: "python software/kubernetes/nautilus_submit.py"
cluster-generic-status-cmd: "python software/kubernetes/nautilus_status.py"
cluster-generic-cancel-cmd: "python software/kubernetes/nautilus_cancel.py"
jobs: 16
latency-wait: 60
retries: 3
keep-going: true
rerun-triggers: mtime

default-resources:
  - "mem_mb=4000"
  - "cpu=1"

set-threads:
  train: 4
  evaluate: 2

set-resources:
  train:
    # Run 3 2024 MvD training (mixed data) was OOMKilled at the 55Gi pod limit after 1.5 h
    mem_mb: 96000
    gpus: 1
    cpu: 4
  evaluate:
    # Run 3 2024 FvT evaluation peaks at ~64 GB RSS (falcon sacct); Run 2 / chunked evaluates need <= 32 GB
    mem_mb: 32000
    gpus: 1
    cpu: 2
