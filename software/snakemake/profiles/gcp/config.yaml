# Snakemake profile for classifier training and evaluation on Google Kubernetes Engine (GKE).
# GPU rules (train, evaluate, or any rule with gres/gpus) are submitted as Kubernetes Jobs
# to GKE using the in-cluster RWX NFS volume (cms-cmu-storage) and the Artifact Registry image.
# All other rules execute locally on the orchestrator/submit machine.
executor: cluster-generic
cluster-generic-submit-cmd: "python software/kubernetes/nautilus_submit.py"
cluster-generic-status-cmd: "python software/kubernetes/nautilus_status.py"
cluster-generic-cancel-cmd: "python software/kubernetes/nautilus_cancel.py"
jobs: 16
latency-wait: 60
retries: 3
keep-going: true
rerun-triggers: mtime

default-resources:
  - "mem_mb=4000"
  - "cpu=1"

set-threads:
  train: 8
  evaluate: 2

set-resources:
  train:
    gpus: 1
    cpu: 8
  evaluate:
    gpus: 1
    cpu: 2
