# Snakemake profile for PSC Bridges 2
executor: slurm
software-deployment-method:
  - apptainer
apptainer-args: "-B /jet/home -B /ocean/projects/phy260026p -B /tmp:/tmp -B /cvmfs:/cvmfs -B /cvmfs/grid.cern.ch/etc/grid-security:/etc/grid-security --env \"X509_USER_PROXY\"=\"/ocean/projects/phy260026p/tgomezes/HH4b/barista/proxy/x509_proxy\" --nv"
slurm-logdir: "slurm_logs"
slurm-status-command: "squeue"
latency-wait: 60
default-resources:
  slurm_partition: "RM-shared"
  slurm_account: "phy260026p"
  runtime: "4h"
  mem_mb: 3800
  cpus_per_task: 2
  tmpdir: "/tmp"

set-resources:
  train:
    slurm_partition: "GPU-shared"
    gres: "gpu:1"
    mem_mb: 20000
