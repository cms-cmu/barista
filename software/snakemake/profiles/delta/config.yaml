executor: slurm
software-deployment-method:
- apptainer
apptainer-args: -B /cvmfs -B /cvmfs/grid.cern.ch/etc/grid-security:/etc/grid-security
  -B /projects/bjsv -B /work/nvme/bjsv -B /work/hdd/bjsv -B /tmp:/tmp --env "X509_USER_PROXY"="proxy/x509_proxy"
  --nv -B software/combine/apptainer_env.sh:/srv/apptainer_env.sh --env BASH_ENV=/srv/apptainer_env.sh
  --env ENV=/srv/apptainer_env.sh
slurm-logdir: slurm_logs
slurm-status-command: squeue
latency-wait: 60
default-resources:
  slurm_partition: gpuA100x4
  slurm_account: bjsv-delta-gpu
  gres: gpu:1
  runtime: 8h
  mem_mb: 24000
  cpus_per_task: 4
  tmpdir: '''/tmp'''
  qos: bjsv-delta-gpu
