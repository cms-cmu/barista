# ==============================================================================
# HH4b Run 3 BACKGROUND SYSTEMATIC (Snakefile_bkg_syst.smk) with the Run 3 DeClustered Library (declib16)
# ==============================================================================
# Run 3 counterpart of analysis_HH4b_bkg_syst_declib16nc.yml (Run 2). Same chain: 16 closure subsamples
# (declustered multijet seeds + ttbar pseudodata), one JCM + FvT per subsample, two-stage closure on
# SvB_MA.ps_hh_fine, Combine. Run 3 specifics follow nominal_run3 (nominal_run3_20261008_f839489-a481023):
#   eras 2022_preEE/EE + 2023_preBPix/BPix, weights_HH4b.yml, fourTag_use_tight (tight btagPNetB),
#   mass_regions [SR, SB] in the classifier, ggF-only SvB (ps_hh = p_sig; no ZZ/ZH), single ggF signal
#   GluGlutoHHto4B_kl-1p00_kt-1p00_c2-0p00, datacard metadata HH4b_run3.yml.
# Note: the declib16 Run 3 library was built from nominal_run3_nontight's 3b data; its subsamples are
# re-tagged here with the tight Run 3 four-tag definition (as the MvD-on-declib16 Run 3 roasts do).
#
#   bin/roast new --config coffea4bees/workflows/config/analysis_HH4b_bkg_syst_declib16_run3.yml \
#       --phases BKG_AB,BKG_C,BKG_F --nautilus
#
label: "HH4b_bkg_syst_declib16_run3"
output_path: "output/{roast_id}/"
per_year_jcm: false
unify_background: true
match_closure_normalization: false
fourTag_use_tight: true
publish_base: "{eos_prod}/{roast_id}"
handoff:
  eos_base: "{eos_prod}/{roast_id}/handoff"
channel: "HH4b"
mix_name: "HH4b_bkg_syst_declib16_run3"
dataset_location: "coffea4bees/metadata/datasets/"

weights_file: "coffea4bees/metadata/weights/weights_HH4b.yml"
years:
  - "2022_preEE"
  - "2022_EE"
  - "2023_preBPix"
  - "2023_BPix"

year_eras:
  2022_preEE: ["B", "C", "D"]
  2022_EE: ["E", "F", "G"]
  2023_preBPix: ["C01", "C02", "C11", "C12", "C3", "C4"]
  2023_BPix: ["D1", "D2"]

phase_f_output_path: "inputs/"
phase_f_label: "Run3_nominal"

ttbar_processes:
  - "TTTo2L2Nu"
  - "TTToSemiLeptonic"
  - "TTToHadronic"

# ==============================================================================
# STAGE A: CLOSURE SUBSAMPLES FROM DECLIB16 RUN 3 MULTIJET SEEDS
# ==============================================================================
inputs:
  upstream_roasts:
    declib: declib16_run3_20261011_b948dfc-33f3094        # DeClustered 16x Run 3 library
    nominal: nominal_run3_20261008_f839489-a481023        # HH4b Run 3 nominal (B, C, C4, D, F), tight 4b
    mixeddata: mixeddata_run3_20260926_956d4bf-aca8a4e    # ttbar pseudodata (the one declib16 Run 3 used)
  mixeddata_all: "{roast:declib}/handoff/synthetic_data_lib16_multijet.yml"
  ttbar_psdata: "{roast:mixeddata}/handoff/ttbar_PSData.yml"
  jcm_hists: "{roast:nominal}/{roast:nominal:output_path}computeJCM/histAll_NoJCM.coffea"
  nominal_hists: "{roast:nominal}/{roast:nominal:output_path}histAll_{roast:nominal:label}.coffea"
  classifier_inputs: "{roast:nominal}/handoff/classifier_inputs_{roast:nominal:id}.json"
  SvB: "{roast:nominal}/friend/SvB_nominal/result.json@@analysis.0.merged"
  SvB_model: "{roast:nominal}/classifier/SvB_nominal/result.json"

worker_memory: "8GB"

subsamples:
  source: "seeds"
  n: 16
  dataset_name: "mixeddata_4b"
  runner:
    condor: true
    shared_dask: true
    worker_memory: "8GB"

subsample_processor_config: "coffea4bees/workflows/config/analysis_config_bkg_syst_subsamples_HH4b_run3.yml"
phaseA_3:
  runner:
    workers: 4
    min_workers: 25
    max_workers: 200

validation:
  plot_template: "coffea4bees/plots/metadata/plots_bkg_syst_mixed_validation_HH4b.yml"
  # ggF-only SvB: ps_zz / ps_zh are -2 placeholders in Run 3
  hists: ["SvB_MA.ps_hh", "SvB_MA.ps", "SvB_MA.tt_vs_mj", "selJets.n", "tagJets.n"]
  model_ttbar: ["TTbar4b_from_d3"]
  model_ttbar_tag: "threeTag"
  subsample: 0

# ==============================================================================
# STAGE B_1: ONE RUN 3 JCM FIT PER SUBSAMPLE (as the nominal B.1) + v0 VALIDATION CLOSURE
# ==============================================================================
phaseB_1:
  per_year_jcm: false
  jcm:
    config: "coffea4bees/analysis/jcm_tools/metadata/HH4b_subsample_jcm_config.yml"
    plot_config: "coffea4bees/plots/metadata/plotsJCM.yml"
    region: "SB"
    year: "Run3"
  validation:
    subsample: 0
    processor_config: "coffea4bees/workflows/config/analysis_config_bkg_syst_test_subsample_HH4b_run3.yml"
    plot_config: "coffea4bees/plots/metadata/plots_subsample_v0_closure_HH4b.yml"
    runner:
      workers: 4
      worker_memory: "6GB"
      condor: true
      shared_dask: true
    config:
      blind: false
      apply_FvT: false
      apply_JCM: true
      apply_trigWeight: false
      apply_btagSF: true
      apply_boosted_veto: false
      run_SvB: false
      top_reconstruction: "fast"
      fill_histograms: "kinematics"
      fourTag_use_tight: true

# ==============================================================================
# STAGE C: FvT PER SUBSAMPLE (GPU: NRP Nautilus). Settings as the nominal Run 3 FvT.
# ==============================================================================
classifier_setting:
  - module: ml.DataLoader
    option:
      - optimize_sliceable_dataset: true
      - num_workers: 2
      - batch_eval: 65536
  - module: ROOT
    option:
      - friend_allow_missing: false
  - module: cms.CollisionData
    option:
      - eras:
          2022_preEE: [B, C, D]
          2022_EE: [E, F, G]
          2023_preBPix: [C01, C02, C11, C12, C3, C4]
          2023_BPix: [D1, D2]
        years:
          - 2022_preEE
          - 2022_EE
          - 2023_preBPix
          - 2023_BPix
  - module: HCR.InputBranch
    option:
      - feature_ancillary: [xW, nSelJets, xbW, year]
      # Run 3: SR from the radial distance rhh, ZZSR/ZHSR/HHSR are independent windows (nominal_run3)
      - mass_regions: [SR, SB]
  - module: ml.Training
    option:
      - precision: fp16

fvt_train_workflow:
  main:
    module: train
    option:
      - --max-loaders 2
      - --max-trainers 3
      - --device cuda cpu
  dataset:
    - module: HCR.FvT.TrainBaseline
      option:
        - --metadata {metadata}
        - --max-workers 20
        - --data-source detector mixed
        - --no-detector-4b
        - --data-mixed-name {mixed_name}
        - --data-mixed-samples {mix}
        - --JCM-weight year:2022_preEE {jcm_2022_preEE}@@JCM_weights
        - --JCM-weight year:2022_EE {jcm_2022_EE}@@JCM_weights
        - --JCM-weight year:2023_preBPix {jcm_2023_preBPix}@@JCM_weights
        - --JCM-weight year:2023_BPix {jcm_2023_BPix}@@JCM_weights
        - --friends "" {nominal_ci}@@HCR_input {mixed_ci}@@HCR_input
  model:
    - module: HCR.FvT.baseline.Train
      option:
        - --kfolds 3
        - --kfold-seed FvT random
        - --kfold-seed-offsets 0
        - --training FixedStep
        - epoch: 20
          bs_init: 1024
        - --finetuning FixedStep
        - epoch: 1
          bs_init: 16384
  setting:
    - module: IO
      option:
        - output: "{model}"

fvt_eval_workflow:
  main:
    module: evaluate
    option:
      - --max-evaluators 3
      - --device cuda cpu
  dataset:
    - module: HCR.FvT.Eval
      option:
        - --metadata {metadata}
        - --max-workers 8
        - --data-source detector
        - --friends "" {nominal_ci}@@HCR_input
  model:
    - module: HCR.FvT.baseline.Eval
      option:
        - --models
        - Final
        - "{model}/result.json"
  analysis:
    - module: kfold.Merge
      option:
        - --name FvT
        - --step 100000
        - --workers 4
        - --clean
  setting:
    - module: IO
      option:
        - output: "{FvT}"

phase_e_fvt:
  channel: "HH4b"
  mix_name: "HH4b_bkg_syst_declib16_run3"
  n_models: 16
  plot_base: "{web_prod}/{roast_id}/classifier_plots"
  precision: "fp16"
  gpu_gres: "mps:25"
  plot_inputs: false
  plot_weights: false
  analyze: false
  evaluate: true

analysis_config:
  processor: "coffea4bees/analysis/processors/processor_HH4b.py"
  weights_file: "coffea4bees/metadata/weights/weights_HH4b.yml"
  runner:
    workers: 8
    chunksize: 100000
    condor: false
    shared_dask: false
    run_performance: false

# ==============================================================================
# STAGE F
# ==============================================================================
analysis_config_mixeddata_bkgs: "coffea4bees/workflows/config/analysis_config_mixeddata_bkgs_HH4b_run3.yml"
closure_plot_config: "coffea4bees/plots/metadata/plots_bkg_syst_closure_HH4b.yml"
trigweights_file: "coffea4bees/metadata/friends/trigweights_Run3_v4.json@@trigWeight"
classifier: "SvB_MA"
# closure / fit variable: the 240-bin ps_hh_fine, as the HH4b nominal (ps_hh is coarse variable-width)
variable: "SvB_MA_ps_hh_fine"
variable_substem: "ps_hh_fine"
# the closure signal shape: the Run 3 ggF SM sample
signal_processes: ["GluGlutoHHto4B_kl-1p00_kt-1p00_c2-0p00"]

closure_rebin_candidates:
  - 2
  - 12
  - 15
  - 16
  - 20
  - 24
max_basis: 10
rebin: 12
no_sqrt_n_priors: false

convert_hist_to_json:
  histos:
    - "SvB_MA.ps_hh_fine"
    - "SvB_MA.ps_hh"

combine_outdir: "bkg_syst_F_3_stats/datacards/"
make_combine_inputs:
  stat_only: ""
  # one Run 3 channel: the fixed HH4b_run3.yml (four 2022/2023 bins, single ggF signal), as nominal_run3
  metadata_template: "coffea4bees/stats_analysis/metadata/HH4b_run3.yml"
  multijet_process: "data"
  unify_background: true
  tt_processes:
    - "TTTo"
    - "TTbar4b_from_d3"

combine_flags: "--three_tag threeTag --four_tag fourTag --region sum --blind"
likelihood_scan_points: 40
likelihood_scan_r_min: 0
likelihood_scan_r_max: 2
likelihood_scan_y_cut: 30
likelihood_scan_y_max: 30

channels:
  HH4b:
    signallabel: "ggHH_kl_1_kt_1_13p0TeV_hbbhbb"
    othersignal: ""
    variable: "SvB_MA.ps_hh_fine"
    signal: "GluGlutoHHto4B_kl-1p00_kt-1p00_c2-0p00"
    # F_2 writes closure_fits/.../{channel}/ with channel = the top-level `channel` (HH4b)
    closure_subdir: "HH4b"
    region: "SR"
    cut: "sum"
    combine_flags: "--three_tag threeTag --four_tag fourTag --region SR --blind"
