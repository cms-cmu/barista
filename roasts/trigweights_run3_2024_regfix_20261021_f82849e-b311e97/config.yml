# =============================================================================
# Trigger-weight friends + validation for 2024 ttbar AND the 2024 SM ggF signal, with the
# fixed UParT b-jet regression (Snakefile_TrigWeights.smk = Phase A.2 + the A.3 validation)
# =============================================================================
#   roast new --config coffea4bees/workflows/config/trigweights_run3_2024_regfix.yml \
#       --step cmslpc:coffea4bees/workflows/Snakefile_TrigWeights.smk
#
# Why: processor_trigger_weights calibrates the jets (apply_jet_calibration, incl. the b-jet
# regression) and emulates the trigger on selJet / canJet pT. barista f82849e4 fixed the UParT
# regression (UParTAK4RegPtRawCorrNeutrino only; it had been x UParTAK4RegPtRawCorr), so every 2024
# trigger weight in trigweights_Run3_v4.json is stale: the TTTo* entries predate any regression (v1,
# mmarcheg's area) and the SM ggF ones (trigweights_run3_2024_signal_20261011_1728019-e0ccb17) carry
# the double regression. This roast remakes both; its merged index REPLACES all 2024 entries of v4
# (-> trigweights_Run3_v5.json). The '2025' TT / ggF aliases point at the same 2024 picoAODs, so 2025
# picks these up too.
#
# Otherwise as trigweights_run3_2024_signal.yml (TriggerSFVectorized 2024 path, tagger PNet).
# The friend index is written ONCE per invocation (merge_friendtree_json).
# =============================================================================

label: "trigweights_run3_2024_regfix"
output_path: "output/trigweights_run3_2024_regfix/"

dataset_location: "coffea4bees/metadata/datasets/"

dataset:
  - "TTToHadronic"
  - "TTToSemiLeptonic"
  - "TTTo2L2Nu"
  - "GluGlutoHHto4B_kl-1p00_kt-1p00_c2-0p00"

years:
  - "2024"

# One runner spec for BOTH steps. Outside test mode every job joins ONE shared dask daemon
# (A.2 forces --shared-dask), and the FIRST job's worker spec and code tarball win, so the
# A.2 spec must already carry what processor_HH4b needs in A.3 (hemisphere_mixing,
# jet_clustering and classifier are imported at module level).
runner: &runner
  condor_cores: 1
  worker_memory: 8GB
  min_workers: 1
  max_workers: 60
  chunksize: 10000
  condor: true
  shared_dask: false   # overridden by A.2's --shared-dask
  run_performance: true
  condor_transfer_input_files:
    - src/
    - coffea4bees/analysis/
    - coffea4bees/metadata/
    - coffea4bees/hemisphere_mixing/
    - coffea4bees/jet_clustering/
    - coffea4bees/classifier/
  allowlist_sites:
    - T1_US_FNAL_Disk
    - T3_US_FNALLPC
    - T2_US_Caltech
    - T2_US_Wisconsin
    - T2_US_Nebraska

trigger_weights:
  processor: "coffea4bees/analysis/processors/processor_trigger_weights.py"
  runner: *runner
  config:
    # Friends land at {this}/{dataset}_{era}/trigWeight.chunkN.root, in this roast's EOS area.
    make_classifier_input: "{eos_prod}/{roast_id}/trigWeights/"
    use_vectorized: true
    tagger: PNet

# A.3: processor_HH4b three times over the same signal, all fourTag (tight, as nominal Run 3):
#   noTrig  no HLT cut, no trigger weight
#   HLT     MC HLT decision (OR of triggers_HH4b.yml), no trigger weight
#   HLT_SF  MC HLT decision x trigger SF (emulated Data/MC eff from the A.2 friend) = nominal Run 3
# plotted per era and Run 3 total, ratio to noTrig, plus a yield/efficiency report.
trig_validation:
  enabled: true
  runner: *runner
  regions: [SR, SB]
