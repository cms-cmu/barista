# ==============================================================================
# GLOBAL WORKFLOW CONFIGURATION
# ==============================================================================
label: "TESTRun2"
output_path: "output/TESTRun2/"

dataset:
  - "GluGluToHHTo4B_cHHH1"
  - "GluGluToHHTo4B_cHHH0"
  - "GluGluToHHTo4B_cHHH2p45"
  - "GluGluToHHTo4B_cHHH5"
  - "ZH4b"
  - "ZZ4b"
  - "ggZH4b"

year_eras:
  UL16_preVFP:
    - "C"
    - "D"
    - "E"
    - "F"
  UL16_postVFP:
    - "F"
    - "G"
    - "H"
  UL17:
    - "C"
    - "D"
    - "E"
    - "F"
  UL18:
    - "A"
    - "B"
    - "C"
    - "D"

# ==============================================================================
# PHASE C & D: CLASSIFIER SETTINGS (Entirely on falcon / PSC)
# ==============================================================================
classifier_setting:
  - module: ml.DataLoader
    option:
      - optimize_sliceable_dataset: true
  - module: ROOT
    option:
      - friend_allow_missing: false
  - module: cms.CollisionData
    option:
      - eras:
          UL16_preVFP: [C, D, E, F]
          UL16_postVFP: [F, G, H]
          UL17: [B, C, D, E, F]
          UL18: [A, B, C, D]
  - module: HCR.InputBranch
    option:
      - feature_ancillary: [xW, nSelJets, xbW, year]

# ==============================================================================
# PHASE C: FvT (falcon). Self-contained per roast: models/friends go to the roast's EOS
# directory, and training/evaluation read THIS roast's classifier-input manifest and JCM fit,
# which Phase B hands over as committed copies (see README, "After Phase B"):
#   metadata/datasets/classifier_inputs_{roast_id}.json   (from output/.../classifier_inputs_friends.json)
#   metadata/weights/JCM/{roast_id}/jetCombinatoricModel_SB_2024_v2.yml
# workflow_overrides: the checked-in templates classifier/config/workflows/HH4b_2024_v2/FvT/
# {train,evaluate}.yml stay the source of truth; only the listed flags are replaced
# (helpers/common.smk: write_workflow_overrides).
# ==============================================================================
fvt:
  eos_base: "root://cmseos.fnal.gov//store/user/jda102/HH4b_prod/{roast_id}"
  plot_base: "root://eosuser.cern.ch//eos/user/j/johnda/www/HH4b/prod/{roast_id}/classifier"
  classifier_config_paths: "coffea4bees"
  wfs_base: "coffea4bees/classifier/config/workflows/HH4b_2024_v2/FvT"
  label: "FvT_nominal"
  output_dir: "output/FvT_nominal/"
  plot_inputs: true
  model: "{eos_base}/classifier/{label}"
  friend: "{eos_base}/friend/{label}"
  train_template: "model: {eos_base}/classifier/{label}"
  eval_template: "model: {eos_base}/classifier/{label}, FvT: {eos_base}/friend/{label}"
  metadata: "coffea4bees/metadata/datasets/classifier_inputs_{roast_id}.json@@HCR_input"
  workflow_overrides:
    --JCM-weight: '"" coffea4bees/metadata/weights/JCM/{roast_id}/jetCombinatoricModel_SB_2024_v2.yml@@JCM_weights'
    '--friends ""': coffea4bees/metadata/datasets/classifier_inputs_{roast_id}.json@@HCR_input

# PHASE C.4 (cmslpc, roast step C4): FvT closure — processor on data with JCM x FvT (no SvB; ttbar
# histograms reused from Phase B.1's wJCM pass, the FvT does not touch MC), plots, cutflow check, closure table. Defaults live in Snakefile_PhaseC_4_FvT_closure.smk; the FvT
# friend is analysis_config.config.friends.FvT below, the JCM the per-roast copy.
fvt_closure:
  datasets: [data, TTToHadronic, TTToSemiLeptonic, TTTo2L2Nu]
  plot_config: "coffea4bees/plots/metadata/plotsAll.yml"

svb:
  # Phase D (falcon). Same per-roast pattern as fvt; the FvT friend used for the background is
  # {eos_base}/friend/FvT_nominal, i.e. THIS roast's Phase C output (train_template below).
  eos_base: "root://cmseos.fnal.gov//store/user/jda102/HH4b_prod/{roast_id}"
  plot_base: "root://eosuser.cern.ch//eos/user/j/johnda/www/HH4b/prod/{roast_id}/classifier"
  classifier_config_paths: "coffea4bees"
  wfs_base: "coffea4bees/classifier/config/workflows/HH4b_2024_v2/SvB"
  label: "SvB_nominal"
  output_dir: "output/SvB_nominal/"
  plot_inputs: true
  evaluate: true
  model: "{eos_base}/classifier/{label}"
  friend: "{eos_base}/friend/{label}"
  train_template: "model: {eos_base}/classifier/{label}, FvT: {eos_base}/friend/FvT_nominal"
  eval_template: "model: {eos_base}/classifier/{label}, SvB: {eos_base}/friend/{label}"
  metadata: "coffea4bees/metadata/datasets/classifier_inputs_{roast_id}.json@@HCR_input"
  workflow_overrides:
    --JCM-weight: '"" coffea4bees/metadata/weights/JCM/{roast_id}/jetCombinatoricModel_SB_2024_v2.yml@@JCM_weights'
    '--friends ""': coffea4bees/metadata/datasets/classifier_inputs_{roast_id}.json@@HCR_input

# ==============================================================================
# PHASE B.2: CLASSIFIER INPUT FRIEND TREES (cmslpc)
# ==============================================================================
# Everything else is inherited from analysis_config below.  The friend trees
# MUST go to EOS: condor workers cannot see the node-local output/ directory,
# and the merge step fails with "cp: cannot stat ..." if this points there.
# {roast_id} is resolved in helpers/common.smk: `roast` passes --config roast_id=<id>
# so every production run gets its own directory; outside roast it defaults to `label`
# (i.e. .../HH4b_prod/TESTRun2/classifier_inputs/ for this file).
classifier_inputs:
  # FvT trains on 3b vs 4b detector data with ttbar subtracted, SvB on signal vs background:
  # the classifier-input friend trees are needed for data (per era), ttbar and the signals.
  # (Without this list B.2 falls back to the top-level `dataset:` = signals only.)
  # mixeddata classifier inputs are made in Phase E, not here.
  datasets:
    - data
    - TTToHadronic
    - TTToSemiLeptonic
    - TTTo2L2Nu
    - GluGluToHHTo4B_cHHH1
    - GluGluToHHTo4B_cHHH0
    - GluGluToHHTo4B_cHHH2p45
    - GluGluToHHTo4B_cHHH5
    - ZH4b
    - ZZ4b
    - ggZH4b
  config:
    make_classifier_input: root://cmseos.fnal.gov//store/user/jda102/HH4b_prod/{roast_id}/classifier_inputs/
    # TEMPORARY (2026-09-19): ZZ4b UL16_preVFP/UL16_postVFP were re-skimmed and the trigger-weight
    # friend index (metadata/datasets/trigweights_2024_v2.json) still points at the old files, so
    # those 16 chunks get no trigger weight (warning instead of error). Remove once the ZZ4b UL16
    # trigger weights are regenerated (Phase A.2) and merged into the index.
    require_trigWeight: false

# ==============================================================================
# PHASE F.1: MAIN ANALYSIS PROCESSOR, CUTFLOWS & PLOTTING
# ==============================================================================
analysis_config:
  processor: "coffea4bees/analysis/processors/processor_HH4b.py"
  dataset_location: "coffea4bees/metadata/datasets/"
  friend_file: "coffea4bees/metadata/friends/friends_HH4b.yml"
  weights_file: "coffea4bees/metadata/weights/weights_HH4b_2024_v2.yml"
  runner:
    workers: 4
    worker_memory: 8GB
    dashboard_address: 0
  config:
    # Per-roast friends: runner.py merges these over the per-year entries of friend_file,
    # so the FvT (and later SvB) friend trees come from THIS roast's Phase C/D, not the
    # nominal_sel production referenced in metadata/friends/friends_HH4b.yml.
    friends:
      FvT: root://cmseos.fnal.gov//store/user/jda102/HH4b_prod/{roast_id}/friend/FvT_nominal/result.json@@analysis.0.merged
    blind: true
    apply_FvT: true
    apply_JCM: true
    apply_trigWeight: true
    apply_btagSF: true
    apply_boosted_veto: false
    run_SvB: true
    SvB_MA: true
    SvB: null
    top_reconstruction: fast
    plot_ttbar_with_weights: true

plot_config: "coffea4bees/plots/metadata/plotsAll_ttbarWeights.yml"

# ==============================================================================
# PHASE F.2: COMBINE STATISTICAL INTERPRETATION & LIMITS
# ==============================================================================
combine_flags: "--blind"
combine_outdir: "datacards/HH4b_fine"
metadata_template: "coffea4bees/stats_analysis/metadata/{channel}.yml"

channels:
  HH4b:
    signallabel: "ggHH_kl_1_kt_1_13p0TeV_hbbhbb"
    othersignal: "ggHH_kl_0_kt_1_13p0TeV_hbbhbb ggHH_kl_2p45_kt_1_13p0TeV_hbbhbb ggHH_kl_5_kt_1_13p0TeV_hbbhbb"
    variable: "SvB_MA.ps_hh_fine"
    signal: "GluGluToHHTo4B_cHHH1"
    closure_subdir: "hh"
  ZZ4b:
    signallabel: "ZZ_bbbb"
    othersignal: "ggHH_kl_1_kt_1_13p0TeV_hbbhbb ZH_bbbb"
    variable: "SvB_MA.ps_zz"
    signal: "ZZ4b"
    closure_subdir: "zz"
  ZH4b:
    signallabel: "ZH_bbbb"
    othersignal: "ggHH_kl_1_kt_1_13p0TeV_hbbhbb ZZ_bbbb"
    variable: "SvB_MA.ps_zh"
    signal: "ZH4b"
    closure_subdir: "zh"
