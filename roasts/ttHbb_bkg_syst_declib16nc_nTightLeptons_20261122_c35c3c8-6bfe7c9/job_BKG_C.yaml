          source /entrypoint.sh 2>/dev/null || true
          if ! command -v snakemake >/dev/null 2>&1 || ! python3 -c "import snakemake_executor_plugin_cluster_generic" >/dev/null 2>&1; then
              pip install --no-cache-dir --quiet snakemake==9.27.0 snakemake-executor-plugin-cluster-generic
