          else
              export X509_USER_PROXY="$PWD/proxy/x509_proxy"
          fi
          export PATH=/workspace/shared/bin:$PATH
          export NAUTILUS_WORKDIR=/workspace/users/algomez/prod/ttHbb_bkg_syst_declib16nc_nTightLeptons_20261122_c35c3c8-6bfe7c9/barista
