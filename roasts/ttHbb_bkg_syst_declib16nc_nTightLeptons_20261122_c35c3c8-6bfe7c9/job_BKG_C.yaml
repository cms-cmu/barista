          export NAUTILUS_IMAGE=us-central1-docker.pkg.dev/access-phy260193-607959/barista/barista:classifier_latest
          export NAUTILUS_ENABLE_CVMFS=false
          export NAUTILUS_EVAL_MEM_GB=36
          export CLASSIFIER_CONFIG_PATHS=coffea4bees
          export ROAST_ID="ttHbb_bkg_syst_declib16nc_nTightLeptons_20261122_c35c3c8-6bfe7c9"
