          cd /workspace/users/algomez/prod/ttHbb_bkg_syst_declib16nc_nTightLeptons_20261122_c35c3c8-6bfe7c9/barista
          mkdir -p logs
          LOG=logs/BKG_C.log
          EXIT=logs/BKG_C.exit
          rm -f "$EXIT"
          rm -rf .snakemake/locks/* 2>/dev/null || true
          mkdir -p .snakemake/locks

          snakemake --rulegraph -s coffea4bees/workflows/Snakefile_bkg_syst_C.smk --configfile roasts/ttHbb_bkg_syst_declib16nc_nTightLeptons_20261122_c35c3c8-6bfe7c9/config.yml --profile software/snakemake/profiles/gcp 2>/dev/null | sed -n '/^digraph /,$p' | dot -Tsvg > "logs/BKG_C_rulegraph.svg" 2>/dev/null || true
          snakemake -s coffea4bees/workflows/Snakefile_bkg_syst_C.smk --configfile roasts/ttHbb_bkg_syst_declib16nc_nTightLeptons_20261122_c35c3c8-6bfe7c9/config.yml --profile software/snakemake/profiles/gcp --jobs 16 --printshellcmds --config roast_id=ttHbb_bkg_syst_declib16nc_nTightLeptons_20261122_c35c3c8-6bfe7c9 eos_prod=root://cmseos.fnal.gov//store/user/algomez/ttHbb_prod web_prod=root://eosuser.cern.ch//eos/user/a/algomez/www/ttHbb/prod 2>&1 | tee "$LOG"
