# ==============================================================================
# HH4b Run 2 BACKGROUND SYSTEMATIC (Snakefile_bkg_syst.smk) with DeClustered Library (declib16nc)
# ==============================================================================
# The HH4b counterpart of analysis_ttHbb_bkg_syst_declib16nc.yml: 16 closure subsamples from the Run 2
# declustered library (declib16nc seeds + ttbar pseudodata), a JCM + FvT per subsample, the two-stage
# closure fit, and Combine datacards. Inputs come from upstream roasts (see `inputs:`); everything
# written is this roast's: local output under output/{roast_id}/, EOS under {eos_prod}/{roast_id}/.
#
# Differences from ttHbb, all following the HH4b nominal (nominal_run2_20260919_a180b1a-a16559c):
#   processor_HH4b, weights_HH4b_2024_v2, no >=7-jet category, inclusive ttbar (TTTo*, not _stitched),
#   ONE Run 2 JCM per subsample (nominal B.1 fits one JCM for all years), the nominal SvB_nominal
#   friend / model, SvB_MA.ps_hh / ps_zh / ps_zz.
#
#   bin/roast new --config coffea4bees/workflows/config/analysis_HH4b_bkg_syst_declib16nc.yml \
#       --phases BKG_AB,BKG_C,BKG_F --nautilus
#   (BKG_AB: A_2-A_3 + B_1 on cmslpc; BKG_C: 16 FvT trainings + evaluations on NRP Nautilus;
#    BKG_F on cmslpc -- F is not validated for HH4b yet, see the STAGE F note below)
#
label: "HH4b_bkg_syst_declib16nc"
output_path: "output/{roast_id}/"
per_year_jcm: false
unify_background: true
match_closure_normalization: false
fourTag_use_tight: false
publish_base: "{eos_prod}/{roast_id}"
handoff:
  eos_base: "{eos_prod}/{roast_id}/handoff"
channel: "HH4b"
mix_name: "HH4b_bkg_syst_declib16nc"
dataset_location: "coffea4bees/metadata/datasets/"

weights_file: "coffea4bees/metadata/weights/weights_HH4b_2024_v2.yml"
years:
  - "UL16_preVFP"
  - "UL16_postVFP"
  - "UL17"
  - "UL18"

year_eras:
  UL16_preVFP: ["C", "D", "E", "F"]
  UL16_postVFP: ["F", "G", "H"]
  UL17: ["C", "D", "E", "F"]
  UL18: ["A", "B", "C", "D"]

phase_f_output_path: "inputs/"
phase_f_label: "TESTRun2"

# ttbar MC in inputs.jcm_hists: the ttbar term of the JCM fits
ttbar_processes:
  - "TTTo2L2Nu"
  - "TTToSemiLeptonic"
  - "TTToHadronic"

# ==============================================================================
# STAGE A: CLOSURE SUBSAMPLES FROM DECLIB16NC MULTIJET SEEDS
#   A_2  multijet seeds from synthetic_data_lib16nc_multijet + ttbar pseudodata -> mixeddata_4b
#   A_3  processor_HH4b over each subsample (pre-JCM histograms for B_1, classifier inputs, SvB)
# ==============================================================================
inputs:
  upstream_roasts:
    declib: declib16nc_run2_20261003_3ab8302-b2d2dec      # DeClustered 16x no-cap Run 2 library
    nominal: nominal_run2_20260919_a180b1a-a16559c        # HH4b Run 2 nominal (B, C, C4, D, F)
    mixeddata: mixeddata_run2_20260927_c39c264-0ce4d59    # ttbar pseudodata
  mixeddata_all: "{roast:declib}/handoff/synthetic_data_lib16nc_multijet.yml"
  ttbar_psdata: "{roast:mixeddata}/handoff/ttbar_PSData.yml"
  # From the nominal roast (it predates handoff/: the classifier-input manifest is its B.2 output,
  # identical to the repo copy metadata/datasets/classifier_inputs_<nominal id>.json)
  jcm_hists: "{roast:nominal}/{roast:nominal:output_path}computeJCM/histAll_NoJCM.coffea"
  nominal_hists: "{roast:nominal}/{roast:nominal:output_path}histAll_{roast:nominal:label}.coffea"
  classifier_inputs: "{roast:nominal}/{roast:nominal:output_path}classifier_inputs/classifier_inputs_friends.json"
  SvB: "{roast:nominal}/friend/SvB_nominal/result.json@@analysis.0.merged"
  SvB_model: "{roast:nominal}/classifier/SvB_nominal/result.json"

worker_memory: "8GB"

subsamples:
  source: "seeds"
  n: 16
  dataset_name: "mixeddata_4b"
  runner:
    condor: true
    shared_dask: true
    worker_memory: "8GB"

# A_3: processor_HH4b over mixeddata_4b:v0..v15 (pre-JCM histograms, classifier inputs, SvB friends)
subsample_processor_config: "coffea4bees/workflows/config/analysis_config_bkg_syst_subsamples_HH4b.yml"
phaseA_3:
  runner:
    workers: 4
    min_workers: 25
    max_workers: 200

validation:
  plot_template: "coffea4bees/plots/metadata/plots_bkg_syst_mixed_validation_HH4b.yml"
  hists: ["SvB_MA.ps_hh", "SvB_MA.ps_zh", "SvB_MA.ps_zz", "SvB_MA.ps", "SvB_MA.tt_vs_mj", "selJets.n", "tagJets.n"]
  model_ttbar: ["TTbar4b_from_d3"]
  model_ttbar_tag: "threeTag"
  subsample: 0

# ==============================================================================
# STAGE B_1: ONE RUN 2 JCM FIT PER SUBSAMPLE (as the nominal B.1) + v0 VALIDATION CLOSURE
# ==============================================================================
phaseB_1:
  per_year_jcm: false
  jcm:
    config: "coffea4bees/analysis/jcm_tools/metadata/HH4b_subsample_jcm_config.yml"
    plot_config: "coffea4bees/plots/metadata/plotsJCM.yml"
    region: "SB"
    year: "RunII"
  validation:
    subsample: 0
    processor_config: "coffea4bees/workflows/config/analysis_config_bkg_syst_test_subsample_HH4b.yml"
    plot_config: "coffea4bees/plots/metadata/plots_subsample_v0_closure_HH4b.yml"
    runner:
      workers: 4
      worker_memory: "6GB"
      condor: true
      shared_dask: true
    config:
      blind: false
      apply_FvT: false
      apply_JCM: true
      apply_trigWeight: false
      apply_btagSF: true
      apply_boosted_veto: false
      run_SvB: false
      top_reconstruction: "fast"
      fill_histograms: "kinematics"

# ==============================================================================
# STAGE C: FvT PER SUBSAMPLE (GPU: NRP Nautilus or falcon)
# Training settings follow the nominal HH4b_2024_v2/FvT/train.yml (3 folds, 20 + 1 epochs).
# ==============================================================================
classifier_setting:
  - module: ml.DataLoader
    option:
      - optimize_sliceable_dataset: true
      - num_workers: 2
      - batch_eval: 65536
  - module: ROOT
    option:
      - friend_allow_missing: false
  - module: cms.CollisionData
    option:
      - eras:
          UL16_preVFP: [C, D, E, F]
          UL16_postVFP: [F, G, H]
          UL17: [B, C, D, E, F]
          UL18: [A, B, C, D]
        years:
          - UL16_preVFP
          - UL16_postVFP
          - UL17
          - UL18
  - module: HCR.InputBranch
    option:
      - feature_ancillary: [xW, nSelJets, xbW, year]
  - module: ml.Training
    option:
      - precision: fp16

fvt_train_workflow:
  main:
    module: train
    option:
      - --max-loaders 2
      - --max-trainers 3
      - --device cuda cpu
  dataset:
    - module: HCR.FvT.TrainBaseline
      option:
        - --metadata {metadata}
        - --max-workers 20
        - --data-source detector mixed
        - --no-detector-4b
        - --data-mixed-name {mixed_name}
        - --data-mixed-samples {mix}
        - --JCM-weight year:UL16_preVFP {jcm_UL16_preVFP}@@JCM_weights
        - --JCM-weight year:UL16_postVFP {jcm_UL16_postVFP}@@JCM_weights
        - --JCM-weight year:UL17 {jcm_UL17}@@JCM_weights
        - --JCM-weight year:UL18 {jcm_UL18}@@JCM_weights
        - --friends "" {nominal_ci}@@HCR_input {mixed_ci}@@HCR_input
  model:
    - module: HCR.FvT.baseline.Train
      option:
        - --kfolds 3
        - --kfold-seed FvT random
        - --kfold-seed-offsets 0
        - --training FixedStep
        - epoch: 20
          bs_init: 1024
        - --finetuning FixedStep
        - epoch: 1
          bs_init: 16384
  setting:
    - module: IO
      option:
        - output: "{model}"

fvt_eval_workflow:
  main:
    module: evaluate
    option:
      - --max-evaluators 3
      - --device cuda cpu
  dataset:
    - module: HCR.FvT.Eval
      option:
        - --metadata {metadata}
        - --max-workers 8
        - --data-source detector
        - --friends "" {nominal_ci}@@HCR_input
  model:
    - module: HCR.FvT.baseline.Eval
      option:
        - --models
        - Final
        - "{model}/result.json"
  analysis:
    - module: kfold.Merge
      option:
        - --name FvT
        - --step 100000
        - --workers 4
        - --clean
  setting:
    - module: IO
      option:
        - output: "{FvT}"

phase_e_fvt:
  channel: "HH4b"
  mix_name: "HH4b_bkg_syst_declib16nc"
  n_models: 16
  plot_base: "{web_prod}/{roast_id}/classifier_plots"
  precision: "fp16"
  gpu_gres: "mps:25"
  plot_inputs: false
  plot_weights: false
  analyze: false
  evaluate: true

# Only `processor` is read (A_3, B_1); F_1's config is analysis_config_mixeddata_bkgs + this `config`
analysis_config:
  processor: "coffea4bees/analysis/processors/processor_HH4b.py"
  weights_file: "coffea4bees/metadata/weights/weights_HH4b_2024_v2.yml"
  runner:
    workers: 8
    chunksize: 100000
    condor: false
    shared_dask: false
    run_performance: false

# ==============================================================================
# STAGE F: 3b data x JCM_v x FvT_v (F_1), two-stage closure (F_2), Combine (F_3/F_4)
# ==============================================================================
analysis_config_mixeddata_bkgs: "coffea4bees/workflows/config/analysis_config_mixeddata_bkgs_HH4b.yml"
closure_plot_config: "coffea4bees/plots/metadata/plots_bkg_syst_closure_HH4b.yml"
classifier: "SvB_MA"
# closure / fit variable: the 240-bin ps_hh_fine, as the HH4b nominal (ps_hh is coarse variable-width)
variable: "SvB_MA_ps_hh_fine"
variable_substem: "ps_hh_fine"

closure_rebin_candidates:
  - 2
  - 12
  - 15
  - 16
  - 20
  - 24
max_basis: 10
rebin: 12
no_sqrt_n_priors: false

convert_hist_to_json:
  histos:
    - "SvB_MA.ps_hh_fine"
    - "SvB_MA.ps_hh"
    - "SvB_MA.ps_zh"
    - "SvB_MA.ps_zz"

combine_outdir: "bkg_syst_F_3_stats/datacards/"
make_combine_inputs:
  stat_only: ""
  metadata_template: "coffea4bees/stats_analysis/metadata/{channel}.yml"
  multijet_process: "data"
  unify_background: true
  tt_processes:
    - "TTTo"
    - "TTbar4b_from_d3"

combine_flags: "--three_tag threeTag --four_tag fourTag --region sum --blind"
likelihood_scan_points: 40
likelihood_scan_r_min: 0
likelihood_scan_r_max: 2
likelihood_scan_y_cut: 30
likelihood_scan_y_max: 30

channels:
  HH4b:
    signallabel: "ggHH_kl_1_kt_1_13p0TeV_hbbhbb"
    othersignal: "ggHH_kl_0_kt_1_13p0TeV_hbbhbb ggHH_kl_2p45_kt_1_13p0TeV_hbbhbb ggHH_kl_5_kt_1_13p0TeV_hbbhbb"
    variable: "SvB_MA.ps_hh_fine"
    signal: "GluGluToHHTo4B_cHHH1"
    # F_2 writes closure_fits/.../{channel}/ with channel = the top-level `channel` (HH4b)
    closure_subdir: "HH4b"
    region: "SR"
    cut: "sum"
    combine_flags: "--three_tag threeTag --four_tag fourTag --region SR --blind"
