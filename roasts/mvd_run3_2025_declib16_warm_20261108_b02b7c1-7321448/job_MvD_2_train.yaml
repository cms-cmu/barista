apiVersion: batch/v1
kind: Job
metadata:
  name: roast-mvd-run3-2025-declib16-warm-84098a-mvd-2-trai
  namespace: cms-cmu
  labels:
    roast: "mvd_run3_2025_declib16_warm_20261108_b02b7c1-7321448"
    step: "MvD_2_train"
    app: "roast-runner"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        roast: "mvd_run3_2025_declib16_warm_20261108_b02b7c1-7321448"
        step: "MvD_2_train"
    spec:
      restartPolicy: Never
      serviceAccountName: roast-runner
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - tu.gp-engine.greatplains.net
      containers:
      - name: orchestrator
        image: docker.io/snakemake/snakemake:v9.27.0
        imagePullPolicy: IfNotPresent
        workingDir: /workspace/users/johnda/prod/mvd_run3_2025_declib16_warm_20261108_b02b7c1-7321448/barista
        command: ["bash", "-c"]
        args:
        - |
          set -e
          echo "=== roast mvd_run3_2025_declib16_warm_20261108_b02b7c1-7321448 step MvD_2_train start $(date) on Nautilus ==="
          pip install --no-cache-dir --quiet snakemake-executor-plugin-cluster-generic fsspec fsspec-xrootd
          mkdir -p /etc/grid-security && ln -sfn /workspace/shared/certificates /etc/grid-security/certificates
          export X509_USER_PROXY="$PWD/proxy/x509_proxy"
          export PATH=/workspace/shared/bin:$PATH
          export NAUTILUS_WORKDIR=/workspace/users/johnda/prod/mvd_run3_2025_declib16_warm_20261108_b02b7c1-7321448/barista
          export CLASSIFIER_CONFIG_PATHS=coffea4bees
          export ROAST_ID="mvd_run3_2025_declib16_warm_20261108_b02b7c1-7321448"
          export ROAST_STEP="MvD_2_train"
          cd /workspace/users/johnda/prod/mvd_run3_2025_declib16_warm_20261108_b02b7c1-7321448/barista
          mkdir -p logs
          LOG=logs/MvD_2_train.log
          EXIT=logs/MvD_2_train.exit
          rm -f "$EXIT"
          rm -rf .snakemake/locks/* 2>/dev/null || true
          mkdir -p .snakemake/locks

          snakemake -s coffea4bees/workflows/Snakefile_MvD_2_train.smk --configfile roasts/mvd_run3_2025_declib16_warm_20261108_b02b7c1-7321448/config.yml --profile software/snakemake/profiles/nautilus --jobs 16 --printshellcmds --config roast_id=mvd_run3_2025_declib16_warm_20261108_b02b7c1-7321448 eos_prod=root://cmseos.fnal.gov//store/user/jda102/HH4b_prod web_prod=root://eosuser.cern.ch//eos/user/j/johnda/www/HH4b/prod 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          echo "$RC" > "$EXIT"
          echo "=== roast mvd_run3_2025_declib16_warm_20261108_b02b7c1-7321448 step MvD_2_train exit $RC $(date) ===" | tee -a "$LOG"
          exit $RC
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "2"
            memory: "4Gi"
        volumeMounts:
        - mountPath: /workspace
          name: ceph-storage
      volumes:
      - name: ceph-storage
        persistentVolumeClaim:
          claimName: cms-cmu-storage
