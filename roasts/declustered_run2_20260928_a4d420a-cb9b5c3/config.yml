# ==============================================================================
# DECLUSTERED (SYNTHETIC) DATASET PRODUCTION — Run 2 (UL16_preVFP, UL16_postVFP, UL17, UL18)
# ==============================================================================
# Driven by Snakefile_DeClustered.smk (D.1 cluster -> D.2 PDFs -> D.3 decluster -> D.4 validate
# -> D.5 monitoring), as declustered_run3.yml. Products: multi-sample dataset YAMLs published to
# EOS under `publish_base`/handoff/, read in place with `runner.py -m <dir> <url> ...`:
#   synthetic_data_4b        declustered multijet (ttbar subtracted) + ttbar pseudodata  <- consumers
#   synthetic_data_multijet  declustered multijet only
# (Same names as the Run 3 roast: the two handoffs define disjoint years of one dataset, so a
# consumer can read both.)
#
# A standalone config, not a `base:` overlay of declustered_run3.yml: `base:` merges dicts
# recursively, so year_eras would keep the Run 3 eras. Everything it reads is pinned under
# `inputs:`, which `roast new` checks lies inside the named upstream roasts:
#   * the nominal Run 2 production -> the FvT (ttbar subtraction, D.1 + D.3) and the B.1 data/ttbar
#     histograms + their runner config (D.4/D.5). Run 2 has only the non-tight four-tag
#     definition, so the nominal itself is the right upstream (no separate non-tight roast).
#     NB its B.1 histograms are BLINDED (blind: true): data 4b is empty in the SR, so D.4/D.5
#     compare at preselection, passDiJetMass and in the SB only.
#   * the Run 2 mixeddata roast (config/mixeddata_run2.yml, M.5) -> the ttbar pseudodata folded into
#     the consumer dataset, the same sample its mixeddata_4b folds in.
#
#   roast new --config coffea4bees/workflows/config/declustered_run2.yml --label declustered_run2 \
#       --step cmslpc:coffea4bees/workflows/Snakefile_DeClustered.smk
#   roast submit <id> --step DeClustered --targets all_D1      # one sub-step at a time
#
label: "declustered_run2"
output_path: "output/{roast_id}/"   # the roast id already carries the label
# EOS area of this roast: PDFs, picoAODs and the handoff YAMLs all go here.
publish_base: "root://cmseos.fnal.gov//store/user/jda102/HH4b_prod/{roast_id}"

# ------------------------------------------------------------------------------
# Products of other roasts (checked by `roast new`, see src/tools/roast.py:check_inputs)
# ------------------------------------------------------------------------------
inputs:
  upstream_roasts: [nominal_run2_20260919_a180b1a-a16559c, mixeddata_run2_20260927_c39c264-0ce4d59]
  # ttbar subtraction in D.1 and D.3 (4b data, FvT.d4_to_t4): the nominal Run 2 FvT (Phase C),
  # the file mixeddata_run2 uses. Covers the data picoAODs in metadata/datasets/data.yml.
  FvT: "root://cmseos.fnal.gov//store/user/jda102/HH4b_prod/nominal_run2_20260919_a180b1a-a16559c/friend/FvT_nominal/result.json@@analysis.0.merged"
  # Nominal Run 2 B.1 data + ttbar histograms. D.4 histograms the declustered data with the runner
  # config written next to them (analysis_config_noJCM.yml) and merges.
  jcm_hists: "root://cmseos.fnal.gov//store/user/jda102/HH4b_prod/nominal_run2_20260919_a180b1a-a16559c/output/TESTRun2/computeJCM/histAll_NoJCM.coffea"
  # ttbar pseudodata folded into synthetic_data_4b per year (as M.4 builds mixeddata_4b).
  ttbar_psdata: "root://cmseos.fnal.gov//store/user/jda102/HH4b_prod/mixeddata_run2_20260927_c39c264-0ce4d59/handoff/ttbar_PSData.yml"
  # Optional: decluster with another declustered roast's PDFs (its <publish_base>/pdfs) and skip
  # D.1 + D.2 -- e.g. to add seeds. Add that roast to upstream_roasts.
  # pdfs: "root://cmseos.fnal.gov//store/user/jda102/HH4b_prod/<declustered roast id>/pdfs"

# Eras with picoAOD files in metadata/datasets/data.yml — same as nominal_run2.yml. (data.yml has a
# UL17 B key with no files: runner reads nothing there, and D.3's per-era check would fail on it.)
year_eras:
  UL16_preVFP: ["C", "D", "E", "F"]
  UL16_postVFP: ["F", "G", "H"]
  UL17: ["C", "D", "E", "F"]
  UL18: ["A", "B", "C", "D"]

# ------------------------------------------------------------------------------
# Selection shared by every processor pass in this roast
# ------------------------------------------------------------------------------
# NON-tight four-tag definition -- in Run 2 the only one. Snakefile_DeClustered.smk refuses to run
# if this is anything but false.
fourTag_use_tight: false

analysis_config:
  processor: "coffea4bees/analysis/processors/processor_HH4b.py"
  dataset_location: "coffea4bees/metadata/datasets/"
  friend_file: "coffea4bees/metadata/friends/friends_HH4b.yml"
  weights_file: "coffea4bees/metadata/weights/weights_HH4b_2024_v2.yml"   # as nominal_run2 / mixeddata_run2
  runner:
    workers: 4
    worker_memory: 8GB
    dashboard_address: 0
  config:
    blind: false
    apply_trigWeight: true
    apply_btagSF: true
    apply_boosted_veto: false
    top_reconstruction: fast
    run_SvB: false
    SvB_MA: null
    SvB: null
    fourTag_use_tight: false

# ------------------------------------------------------------------------------
# D.1: cluster (4b data, ttbar subtracted with inputs.FvT) -> splitting histograms
# ------------------------------------------------------------------------------
cluster:
  # The Run 2 cluster config (scripts/synthetic-dataset-cluster.sh). It sets no chunk size, and
  # the clustering is O(n^3) in jets with a long tail (Run 3: hours on a few heavy chunks), so
  # pin small chunks here. The shared dask daemon is started by this, the first condor job, and
  # keeps its worker size for D.3/D.4: 8GB, the largest any stage needs.
  config_template: "coffea4bees/analysis/metadata/cluster_4b.yml"
  chunksize: 20000
  worker_memory: 8GB

# ------------------------------------------------------------------------------
# D.2: sampling PDFs (make_jet_splitting_PDFs.py) -> <publish_base>/pdfs/, one per UL year
# (as the committed jet_clustering/jet-splitting-PDFs-00-09-00/clustering_pdfs_vs_pT_UL*.yml)
# ------------------------------------------------------------------------------
pdfs: {}      # (no options yet)

# ------------------------------------------------------------------------------
# D.3: decluster -> <publish_base>/handoff/<dataset_name>.yml
# ------------------------------------------------------------------------------
declustering:
  # The Run 2 skimmer config (scripts/synthetic-dataset-make-dataset.sh); this roast overrides its
  # base_path, PDF file, seed and ttbar subtraction. Its condor_transfer_input_files list lacks
  # coffea4bees/skimmer, which only matters without the shared dask daemon (whose tarball comes
  # from D.1's config: all of coffea4bees/). b-jet pT floor: from object_selection (Run 2: 40 GeV).
  skimmer_template: "coffea4bees/skimmer/metadata/declustering.yml"
  chunksize: 25000              # template: 100000 -- see cluster.chunksize
  worker_memory: 8GB            # template: 4GB
  n_seeds: 1
  subtract_ttbar: true          # multijet only; the consumer dataset adds inputs.ttbar_psdata
  dataset_name: "synthetic_data_4b"                  # multijet + ttbar pseudodata (consumers)
  multijet_dataset_name: "synthetic_data_multijet"   # multijet only (D.4/D.5)
  ttbar_psdata_name: "ttbar_PSData"                  # dataset key inside inputs.ttbar_psdata

# ------------------------------------------------------------------------------
# D.4: validation (declustered data histogrammed with the upstream B.1 config) and
# D.5: monitoring (plots + closure table of the D.4 histograms, D.2 PDF gallery)
# ------------------------------------------------------------------------------
validation:
  # ttbar MC in the upstream histograms (nominal_run2 B.1 jcm.datasets; inclusive TT)
  ttbar: ["TTToHadronic", "TTToSemiLeptonic", "TTTo2L2Nu"]
  plot_template: "coffea4bees/plots/metadata/plotsDeClustered_validation.yml"
  # seed: 0          # seed plotted in D.5; default: drawn from the roast id
  # known_counts: <blessed cutflow_declustered.yml, once the first roast has written one>
