apiVersion: batch/v1
kind: Job
metadata:
  name: roast-fit-quality-replay-run3-6e5d75-fitquality
  namespace: cms-cmu
  labels:
    roast: "fit_quality_replay_run3_20261104_aeb85cc-6e7b2b3"
    step: "FitQualityReplay"
    app: "roast-runner"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        roast: "fit_quality_replay_run3_20261104_aeb85cc-6e7b2b3"
        step: "FitQualityReplay"
    spec:
      restartPolicy: Never
      serviceAccountName: roast-runner
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - tu.gp-engine.greatplains.net
      containers:
      - name: orchestrator
        image: docker.io/snakemake/snakemake:v9.27.0
        imagePullPolicy: IfNotPresent
        workingDir: /workspace/users/johnda/prod/fit_quality_replay_run3_20261104_aeb85cc-6e7b2b3/barista
        command: ["bash", "-c"]
        args:
        - |
          set -e
          echo "=== roast fit_quality_replay_run3_20261104_aeb85cc-6e7b2b3 step FitQualityReplay start $(date) on Nautilus ==="
          pip install --no-cache-dir --quiet snakemake-executor-plugin-cluster-generic fsspec fsspec-xrootd
          mkdir -p /etc/grid-security && ln -sfn /workspace/shared/certificates /etc/grid-security/certificates
          export X509_USER_PROXY="$PWD/proxy/x509_proxy"
          export PATH=/workspace/shared/bin:$PATH
          export NAUTILUS_WORKDIR=/workspace/users/johnda/prod/fit_quality_replay_run3_20261104_aeb85cc-6e7b2b3/barista
          export CLASSIFIER_CONFIG_PATHS=coffea4bees
          export ROAST_ID="fit_quality_replay_run3_20261104_aeb85cc-6e7b2b3"
          export ROAST_STEP="FitQualityReplay"
          cd /workspace/users/johnda/prod/fit_quality_replay_run3_20261104_aeb85cc-6e7b2b3/barista
          mkdir -p logs
          LOG=logs/FitQualityReplay.log
          EXIT=logs/FitQualityReplay.exit
          rm -f "$EXIT"
          rm -rf .snakemake/locks/* 2>/dev/null || true
          mkdir -p .snakemake/locks

          snakemake -s coffea4bees/workflows/Snakefile_FitQualityReplay.smk output/fit_quality_replay_run3/fvt_2025_seed1/fit_quality.json --configfile roasts/fit_quality_replay_run3_20261104_aeb85cc-6e7b2b3/config.yml --profile software/snakemake/profiles/nautilus --jobs 16 --printshellcmds --config roast_id=fit_quality_replay_run3_20261104_aeb85cc-6e7b2b3 eos_prod=root://cmseos.fnal.gov//store/user/jda102/HH4b_prod web_prod=root://eosuser.cern.ch//eos/user/j/johnda/www/HH4b/prod 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          echo "$RC" > "$EXIT"
          echo "=== roast fit_quality_replay_run3_20261104_aeb85cc-6e7b2b3 step FitQualityReplay exit $RC $(date) ===" | tee -a "$LOG"
          exit $RC
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "2"
            memory: "4Gi"
        volumeMounts:
        - mountPath: /workspace
          name: ceph-storage
      volumes:
      - name: ceph-storage
        persistentVolumeClaim:
          claimName: cms-cmu-storage
