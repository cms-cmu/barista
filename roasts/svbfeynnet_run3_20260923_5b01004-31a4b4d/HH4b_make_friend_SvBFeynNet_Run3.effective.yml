runner:
  workers: 4
  worker_memory: 8GB
  # Without this runner.py uses a local process pool: the Snakefile's run_on_condor
  # param is never passed on, and 8 local jobs overload an LPC login node.
  condor: true
  condor_cores: 1
  friend_metafile: make_friend_SvB_FeynNet
  # Fresh directory: the 2025_v3 friends are still referenced by committed JSONs
  # (and pinned roasts); writing there would overwrite them in place.
  friend_base: &friend_base root://cmseos.fnal.gov//store/user/jda102/XX4b/2026_Run3_SvBFeynNet
  # friend_base: &friend_base /tmp/SvBFeynNet_test   # local path for testing
  # MC 2023_preBPix (mixed parking) reads is_parking from its friend tree. Only that
  # friend is injected: loading the existing SvB_FeynNet friend would defeat the point.
  friend_file: coffea4bees/metadata/friends/friends_HH4b.yml

friends_include: [is_parking]

config:
  blind: false
  apply_FvT: false
  apply_trigWeight: false
  apply_btagSF: true
  apply_boosted_veto: false
  run_SvB: true
  # Two-model dispatch: parking and preparking ensembles. The processor
  # picks per event based on event.is_parking (data: from run number;
  # MC: loaded from is_parking friend tree, generated by
  # processor_isParking_friend.py). See parking_lumi_fractions.yml.
  SvB_FeynNet:
    parking:
      - path: coffea4bees/metadata/weights/pytorch_models/FeynNet/Run3/parking_svb/model.onnx
        preprocess: coffea4bees/metadata/weights/pytorch_models/FeynNet/Run3/parking_svb/preprocess.json
    preparking:
      - path: coffea4bees/metadata/weights/pytorch_models/FeynNet/Run3/preparking_svb/model.onnx
        preprocess: coffea4bees/metadata/weights/pytorch_models/FeynNet/Run3/preparking_svb/preprocess.json
  top_reconstruction: null
  fill_histograms: false
  make_friend_SvB_FeynNet: *friend_base
