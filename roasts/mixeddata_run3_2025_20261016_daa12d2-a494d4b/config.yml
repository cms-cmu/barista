# ==============================================================================
# MIXED-DATA DATASET PRODUCTION — Run 3, 2025 only (2025 data, Summer24 = 2024 ttbar MC)
# ==============================================================================
# mixeddata_run3_2024.yml for the sixteen 2025 eras. A standalone copy, not a `base:` overlay
# (the layered merge is a dict merge, so the base's '2024' year_eras key would survive next to '2025').
# What differs from mixeddata_run3_2024.yml:
#   * eras        the 16 2025 picoAOD keys of data.yml (B..G x ParkingHH0/1, PromptReco v1/v2), as
#                 nominal_run3_2025_nontight.yml.
#   * FvT + JCM   from the 2025 non-tight roast nominal_run3_2025_nontight_20261015_9ac9a30-b172c05
#                 (config/nominal_run3_2025_nontight.yml, phases B, C, C4; archived). JCM chi2/ndf 709.
#                 Its own C.4 closure is broken by an over-confident FvT tail (35,787 events |FvT| > 100);
#                 with FvT_pd3_floor 0.01 (nominal_run3_2025_nontight_pd3floor_20261016_daa12d2-72775f5)
#                 it closes at SB 0.988, SR 0.978. The mixing only uses the FvT as a ttbar-removal
#                 probability (rand > d4_to_t4 / d3_to_t3): the tail events have d3_to_t3 >> 1 with or
#                 without the floor (floored: up to 100), so they are removed either way -- no floor here.
#   * ttbar       '2025' = the 2024 Summer24 TTTo* (TT.yml alias), lumi-scaled to 110.625 /fb; trigger
#                 weights from the 2024 friends; no b-tag SF (skipped for 2024/2025 in the mixer and M.5).
#   * hemilib     built fresh in M.1 (no 2025 library exists yet), prescaled to ~2M hemispheres as 2024.
#   * signal      M.7 off: there is no 2025 (or '2025'-mapped) signal MC.
# ==============================================================================
# Driven by Snakefile_MakeMixedData.smk (M.1 hemisphere library -> M.2 mix -> M.3 validate + mixed JCM
# -> M.5 ttbar pseudodata -> M.6 validation). Products: dataset YAMLs under `publish_base`/handoff/.
#
#   roast new --config coffea4bees/workflows/config/mixeddata_run3_2025.yml \
#       --step cmslpc:coffea4bees/workflows/Snakefile_MakeMixedData.smk
#   roast submit <id> --step MakeMixedData --targets all_M1      # one sub-step at a time
#
label: "mixeddata_run3_2025"
output_path: "output/{roast_id}/"   # the roast id already carries the label
# EOS area of this roast: hemisphere library, picoAODs and the handoff YAMLs all go here.
publish_base: "{eos_prod}/{roast_id}"

# ------------------------------------------------------------------------------
# Products of other roasts (checked by `roast new`, see src/tools/roast.py:check_inputs)
# ------------------------------------------------------------------------------
inputs:
  upstream_roasts: [nominal_run3_2025_nontight_20261015_9ac9a30-b172c05]
  # ttbar subtraction in M.1 (4b data, FvT.d4_to_t4) and M.2 (3b data, FvT.d3_to_t3): the non-tight
  # 2025 FvT (Phase C of that roast). Covers every data picoAOD in data.yml '2025' (1,021 files).
  FvT: "{roast:nominal_run3_2025_nontight_20261015_9ac9a30-b172c05}/friend/FvT_nominal/result.json@@analysis.0.merged"
  # Non-tight JCM: M.2 applies it as pseudo-tag weights. Its data + ttbar histograms feed the
  # mixed-data JCM fit (M.3), so both must come from the same selection as the mixing.
  JCM: "{roast:nominal_run3_2025_nontight_20261015_9ac9a30-b172c05}/output/Run3_2025_nontight/computeJCM/JCM_Run3_2025_nontight_v1/jetCombinatoricModel_SB_Run3_2025_nontight_v1.yml"
  jcm_hists: "{roast:nominal_run3_2025_nontight_20261015_9ac9a30-b172c05}/output/Run3_2025_nontight/computeJCM/histAll_NoJCM.coffea"

# Eras as they appear in metadata/datasets/data.yml (picoAOD keys) — same as nominal_run3_2025_nontight.yml.
# '2025' MUST stay quoted: unquoted it parses as an int and misses the string-keyed metadata.
year_eras:
  '2025': ["B01", "B11", "C01", "C02", "C11", "C12", "D01", "D11", "E01", "E11", "F01", "F02", "F11", "F12", "G01", "G11"]

# ttbar MC for the M.5 pseudodata. Must be the samples the upstream JCM roast histogrammed
# (jcm_hists): the B.1 `jcm.datasets` of nominal_run3_2025_nontight.yml.
ttbar: ["TTToHadronic", "TTToSemiLeptonic", "TTTo2L2Nu"]

# ------------------------------------------------------------------------------
# Selection shared by every processor pass in this roast
# ------------------------------------------------------------------------------
# NON-tight four-tag definition (nJet_tagged >= 4), as every mixed-data roast; the JCM comes from
# the non-tight B.1 roast. Snakefile_MakeMixedData.smk refuses to run if this is anything but false.
fourTag_use_tight: false

analysis_config:
  processor: "coffea4bees/analysis/processors/processor_HH4b.py"
  dataset_location: "coffea4bees/metadata/datasets/"
  friend_file: "coffea4bees/metadata/friends/friends_HH4b.yml"
  weights_file: "coffea4bees/metadata/weights/weights_HH4b.yml"
  runner:
    workers: 4
    worker_memory: 8GB
    dashboard_address: 0
  config:
    blind: false
    apply_trigWeight: true
    apply_btagSF: true
    apply_boosted_veto: false
    top_reconstruction: fast
    run_SvB: false
    SvB_MA: null
    SvB: null
    fourTag_use_tight: false

# ------------------------------------------------------------------------------
# M.1: hemisphere library (4b data, ttbar subtracted with inputs.FvT)
# ------------------------------------------------------------------------------
hemi_library:
  config_template: "coffea4bees/analysis/metadata/make_hemi_library_4b.yml"
  study_threshold: 1000        # min per-category count for study_hemispheres.py
  # ~2M hemispheres, as 2024 (12.86M unprescaled there; 2025 has ~0.85x the 4b per fb^-1 at the
  # same ~110 fb^-1). Every M.2 mixer worker loads its year's whole library (~3 GB per million).
  max_hemis: 2000000

# ------------------------------------------------------------------------------
# M.2: mixing (3b data events, hemispheres replaced from the library) -- 2024's proven settings
# ------------------------------------------------------------------------------
mixing:
  skimmer_template: "coffea4bees/skimmer/metadata/mixeddata_Run3.yml"
  dataset_name: "mixeddata_all"
  default_rank: 0              # int (same rank both sides) or [rp, rn]; 0 = nearest neighbour
  use_topk_matching: true
  k_neighbors: 10
  collision_mode: retry        # ignore | drop | retry
  use_boost_corrected_matching: true
  boost_acceptance_eta: 2.4
  # 12GB / 50k-event chunks: what the ~2M-hemisphere 2024 library needed (see mixeddata_run3_2024.yml).
  worker_memory: 12GB
  chunksize: 50000
  runner:
    skipbadfiles: false

# ------------------------------------------------------------------------------
# M.3: validation + mixed-data JCM (mixeddata_all as the "3b" sample, float_t)
# ------------------------------------------------------------------------------
mixed_jcm:
  config: "coffea4bees/analysis/jcm_tools/metadata/mixeddata_all_config_Run3.yml"
  float_t: true

# ------------------------------------------------------------------------------
# M.5: ttbar pseudodata -> ttbar_PSData (one sample, shared by every subsample)
# ------------------------------------------------------------------------------
ttbar_psdata:
  dataset_name: "ttbar_PSData"
  seed: 5
  require_trigWeight: true     # friends_HH4b.yml '2025' = the 2024 TTTo* trigWeight friends
  worker_memory: 6GB
  chunksize: 100000
  picosize: 100000
  runner:
    skipbadfiles: false

# ------------------------------------------------------------------------------
# M.7: signal check -- off: no 2025 signal MC (and no 2025 SvB).
# ------------------------------------------------------------------------------
signal_check:
  enabled: false
