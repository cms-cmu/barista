analysis_config:
  processor: coffea4bees/analysis/processors/processor_ttHbb.py
  dataset_location: coffea4bees/metadata/datasets/
  friend_file: coffea4bees/metadata/friends/friends_ttHbb.yml
  weights_file: coffea4bees/metadata/weights/weights_ttHbb.yml
  runner:
    workers: 4
    worker_memory: 8GB
    chunksize: 100000
    min_workers: 50
    max_workers: 250
    dashboard_address: 0
  config:
    friends:
      FvT: "{eos_prod}/{roast_id}/friend/FvT_ttHbb_stitched/result.json@@analysis.0.merged"
      SvB_MA: "{eos_prod}/{roast_id}/friend/SvB_MA_ttHbb_stitched/result.json@@analysis.0.merged"
    blind: true
    apply_FvT: true
    apply_JCM: true
    apply_trigWeight: true
    apply_btagSF: true
    apply_boosted_veto: false
    apply_lepton_veto: false
    run_SvB: true
    SvB_MA: true
    SvB: null
    candidates_selection_cfg: coffea4bees/analysis/metadata/candidates_selection_thresholds_ttHbb_corner_veto.yml
    hist_cuts:
    - pass_nSelJets_gt6
    - passLeptonVeto
    top_reconstruction: fast
    plot_ttbar_with_weights: true
    pairing: nominal
    fill_histograms: SvB
    svb_binning_file: output/SvB_MA_ttHbb_stitched/svb_quantiles.json
