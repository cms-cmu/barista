apiVersion: batch/v1
kind: Job
metadata:
  name: roast-lowpt-run3-905e65-d
  namespace: cms-cmu
  labels:
    roast: "lowpt_run3_20261119_ebe2baa-8a8a764"
    step: "D"
    app: "roast-runner"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        roast: "lowpt_run3_20261119_ebe2baa-8a8a764"
        step: "D"
    spec:
      restartPolicy: Never
      serviceAccountName: roast-runner
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - tu.gp-engine.greatplains.net
                - k8s-chase-ci-03.calit2.optiputer.net
      containers:
      - name: orchestrator
        image: docker.io/snakemake/snakemake:v9.27.0
        imagePullPolicy: IfNotPresent
        workingDir: /workspace/users/algomez/prod/lowpt_run3_20261119_ebe2baa-8a8a764/barista
        command: ["bash", "-c"]
        args:
        - |
          set -e
          echo "=== roast lowpt_run3_20261119_ebe2baa-8a8a764 step D start $(date) on nautilus ==="
          pip install --no-cache-dir --quiet snakemake-executor-plugin-cluster-generic fsspec fsspec-xrootd
          mkdir -p /etc/grid-security && ln -sfn /workspace/shared/certificates /etc/grid-security/certificates
          export X509_CERT_DIR=/etc/grid-security/certificates
          if [ -s "$PWD/proxy/x509_proxy" ]; then
              install -m 600 "$PWD/proxy/x509_proxy" /tmp/x509_proxy
              export X509_USER_PROXY=/tmp/x509_proxy
          else
              export X509_USER_PROXY="$PWD/proxy/x509_proxy"
          fi
          export PATH=/workspace/shared/bin:$PATH
          export NAUTILUS_WORKDIR=/workspace/users/algomez/prod/lowpt_run3_20261119_ebe2baa-8a8a764/barista
          export NAUTILUS_NAMESPACE=cms-cmu
          export CLASSIFIER_CONFIG_PATHS=coffea4bees
          export ROAST_ID="lowpt_run3_20261119_ebe2baa-8a8a764"
          export ROAST_STEP="D"
          cd /workspace/users/algomez/prod/lowpt_run3_20261119_ebe2baa-8a8a764/barista
          mkdir -p logs
          LOG=logs/D.log
          EXIT=logs/D.exit
          rm -f "$EXIT"
          rm -rf .snakemake/locks/* 2>/dev/null || true
          mkdir -p .snakemake/locks
          snakemake -s coffea4bees/workflows/Snakefile_PhaseD.smk --configfile roasts/lowpt_run3_20261119_ebe2baa-8a8a764/config.yml --profile software/snakemake/profiles/nautilus --unlock || true

          snakemake --rulegraph -s coffea4bees/workflows/Snakefile_PhaseD.smk --configfile roasts/lowpt_run3_20261119_ebe2baa-8a8a764/config.yml --profile software/snakemake/profiles/nautilus 2>/dev/null | sed -n '/^digraph /,$p' | dot -Tsvg > "logs/D_rulegraph.svg" 2>/dev/null || true
          snakemake -s coffea4bees/workflows/Snakefile_PhaseD.smk --configfile roasts/lowpt_run3_20261119_ebe2baa-8a8a764/config.yml --profile software/snakemake/profiles/nautilus --jobs 16 --printshellcmds --config roast_id=lowpt_run3_20261119_ebe2baa-8a8a764 eos_prod=root://cmseos.fnal.gov//store/user/algomez/HH4b_lowpt_prod web_prod=root://eosuser.cern.ch//eos/user/a/algomez/www/HH4b_lowpt/prod --rerun-incomplete 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          echo "$RC" > "$EXIT"
          if [ "$RC" = "0" ]; then
              snakemake --summary -s coffea4bees/workflows/Snakefile_PhaseD.smk --configfile roasts/lowpt_run3_20261119_ebe2baa-8a8a764/config.yml --profile software/snakemake/profiles/nautilus > "logs/D_summary.txt" 2>/dev/null || true
          fi
          echo "=== roast lowpt_run3_20261119_ebe2baa-8a8a764 step D exit $RC $(date) ===" | tee -a "$LOG"
          exit $RC
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "500m"
            memory: "2Gi"
        volumeMounts:
        - mountPath: /workspace
          name: ceph-storage
      volumes:
      - name: ceph-storage
        persistentVolumeClaim:
          claimName: cms-cmu-storage
