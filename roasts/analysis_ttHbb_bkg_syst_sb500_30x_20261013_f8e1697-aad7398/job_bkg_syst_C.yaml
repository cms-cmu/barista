apiVersion: batch/v1
kind: Job
metadata:
  name: roast-analysis-tthbb-bkg-syst-sb500-30x-aa78bd-bkg-syst-c
  namespace: cms-cmu
  labels:
    roast: "analysis_ttHbb_bkg_syst_sb500_30x_20261013_f8e1697-aad7398"
    step: "bkg_syst_C"
    app: "roast-runner"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        roast: "analysis_ttHbb_bkg_syst_sb500_30x_20261013_f8e1697-aad7398"
        step: "bkg_syst_C"
    spec:
      restartPolicy: Never
      serviceAccountName: roast-runner
      containers:
      - name: orchestrator
        image: docker.io/snakemake/snakemake:v9.27.0
        imagePullPolicy: IfNotPresent
        workingDir: /workspace/users/algomez/prod/analysis_ttHbb_bkg_syst_sb500_30x_20261013_f8e1697-aad7398/barista
        command: ["bash", "-c"]
        args:
        - |
          set -e
          echo "=== roast analysis_ttHbb_bkg_syst_sb500_30x_20261013_f8e1697-aad7398 step bkg_syst_C start $(date) on Nautilus ==="
          pip install --no-cache-dir --quiet snakemake-executor-plugin-cluster-generic fsspec fsspec-xrootd
          mkdir -p /etc/grid-security && ln -sfn /workspace/shared/certificates /etc/grid-security/certificates
          export X509_USER_PROXY="$PWD/proxy/x509_proxy"
          export PATH=/workspace/shared/bin:$PATH
          export NAUTILUS_WORKDIR=/workspace/users/algomez/prod/analysis_ttHbb_bkg_syst_sb500_30x_20261013_f8e1697-aad7398/barista
          export CLASSIFIER_CONFIG_PATHS=coffea4bees
          export ROAST_ID="analysis_ttHbb_bkg_syst_sb500_30x_20261013_f8e1697-aad7398"
          export ROAST_STEP="bkg_syst_C"
          cd /workspace/users/algomez/prod/analysis_ttHbb_bkg_syst_sb500_30x_20261013_f8e1697-aad7398/barista
          mkdir -p logs
          LOG=logs/bkg_syst_C.log
          EXIT=logs/bkg_syst_C.exit
          rm -f "$EXIT"
          rm -rf .snakemake/locks || true

          snakemake -s coffea4bees/workflows/Snakefile_bkg_syst_C.smk --configfile roasts/analysis_ttHbb_bkg_syst_sb500_30x_20261013_f8e1697-aad7398/config.yml --profile software/snakemake/profiles/nautilus --jobs 16 --printshellcmds --config roast_id=analysis_ttHbb_bkg_syst_sb500_30x_20261013_f8e1697-aad7398 eos_prod=root://cmseos.fnal.gov//store/user/algomez/HH4b_prod web_prod=root://eosuser.cern.ch//eos/user/a/algomez/www/ttHbb/prod 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          echo "$RC" > "$EXIT"
          echo "=== roast analysis_ttHbb_bkg_syst_sb500_30x_20261013_f8e1697-aad7398 step bkg_syst_C exit $RC $(date) ===" | tee -a "$LOG"
          exit $RC
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "2"
            memory: "4Gi"
        volumeMounts:
        - mountPath: /workspace
          name: ceph-storage
      volumes:
      - name: ceph-storage
        persistentVolumeClaim:
          claimName: cms-cmu-storage
