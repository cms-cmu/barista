apiVersion: batch/v1
kind: Job
metadata:
  name: roast-mvd-run3-2025-596ed1-mvd-3-svb
  namespace: cms-cmu
  labels:
    roast: "mvd_run3_2025_20261028_4187034-e2edb1d"
    step: "MvD_3_svb"
    app: "roast-runner"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        roast: "mvd_run3_2025_20261028_4187034-e2edb1d"
        step: "MvD_3_svb"
    spec:
      restartPolicy: Never
      serviceAccountName: roast-runner
      containers:
      - name: orchestrator
        image: docker.io/snakemake/snakemake:v9.27.0
        imagePullPolicy: IfNotPresent
        workingDir: /workspace/users/johnda/prod/mvd_run3_2025_20261028_4187034-e2edb1d/barista
        command: ["bash", "-c"]
        args:
        - |
          set -e
          echo "=== roast mvd_run3_2025_20261028_4187034-e2edb1d step MvD_3_svb start $(date) on Nautilus ==="
          pip install --no-cache-dir --quiet snakemake-executor-plugin-cluster-generic fsspec fsspec-xrootd
          mkdir -p /etc/grid-security && ln -sfn /workspace/shared/certificates /etc/grid-security/certificates
          export X509_USER_PROXY="$PWD/proxy/x509_proxy"
          export PATH=/workspace/shared/bin:$PATH
          export NAUTILUS_WORKDIR=/workspace/users/johnda/prod/mvd_run3_2025_20261028_4187034-e2edb1d/barista
          export CLASSIFIER_CONFIG_PATHS=coffea4bees
          export ROAST_ID="mvd_run3_2025_20261028_4187034-e2edb1d"
          export ROAST_STEP="MvD_3_svb"
          cd /workspace/users/johnda/prod/mvd_run3_2025_20261028_4187034-e2edb1d/barista
          mkdir -p logs
          LOG=logs/MvD_3_svb.log
          EXIT=logs/MvD_3_svb.exit
          rm -f "$EXIT"
          rm -rf .snakemake/locks || true

          snakemake -s coffea4bees/workflows/Snakefile_MvD_3_svb.smk --configfile roasts/mvd_run3_2025_20261028_4187034-e2edb1d/config.yml --profile software/snakemake/profiles/nautilus --jobs 16 --printshellcmds --config roast_id=mvd_run3_2025_20261028_4187034-e2edb1d eos_prod=root://cmseos.fnal.gov//store/user/jda102/HH4b_prod web_prod=root://eosuser.cern.ch//eos/user/j/johnda/www/HH4b/prod --set-resources train:mem_mb=180000 train:gpus=1 train:cpu=4 evaluate:mem_mb=96000 evaluate:gpus=1 evaluate:cpu=2 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          echo "$RC" > "$EXIT"
          echo "=== roast mvd_run3_2025_20261028_4187034-e2edb1d step MvD_3_svb exit $RC $(date) ===" | tee -a "$LOG"
          exit $RC
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "2"
            memory: "4Gi"
        volumeMounts:
        - mountPath: /workspace
          name: ceph-storage
      volumes:
      - name: ceph-storage
        persistentVolumeClaim:
          claimName: cms-cmu-storage
