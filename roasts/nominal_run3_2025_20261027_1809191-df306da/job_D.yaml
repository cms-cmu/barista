apiVersion: batch/v1
kind: Job
metadata:
  name: roast-nominal-run3-2025-479549-d
  namespace: cms-cmu
  labels:
    roast: "nominal_run3_2025_20261027_1809191-df306da"
    step: "D"
    app: "roast-runner"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        roast: "nominal_run3_2025_20261027_1809191-df306da"
        step: "D"
    spec:
      restartPolicy: Never
      serviceAccountName: roast-runner
      containers:
      - name: orchestrator
        image: docker.io/snakemake/snakemake:v9.27.0
        imagePullPolicy: IfNotPresent
        workingDir: /workspace/users/johnda/prod/nominal_run3_2025_20261027_1809191-df306da_v3/barista
        command: ["bash", "-c"]
        args:
        - |
          set -e
          echo "=== roast nominal_run3_2025_20261027_1809191-df306da step D start $(date) on Nautilus ==="
          pip install --no-cache-dir --quiet snakemake-executor-plugin-cluster-generic fsspec fsspec-xrootd
          mkdir -p /etc/grid-security && ln -sfn /workspace/shared/certificates /etc/grid-security/certificates
          export X509_USER_PROXY="$PWD/proxy/x509_proxy"
          export PATH=/workspace/shared/bin:$PATH
          export NAUTILUS_WORKDIR=/workspace/users/johnda/prod/nominal_run3_2025_20261027_1809191-df306da_v3/barista
          export CLASSIFIER_CONFIG_PATHS=coffea4bees
          export ROAST_ID="nominal_run3_2025_20261027_1809191-df306da"
          export ROAST_STEP="D"
          cd /workspace/users/johnda/prod/nominal_run3_2025_20261027_1809191-df306da_v3/barista
          mkdir -p logs
          LOG=logs/D.log
          EXIT=logs/D.exit
          rm -f "$EXIT"
          rm -rf .snakemake/locks || true

          snakemake -s coffea4bees/workflows/Snakefile_PhaseD.smk --configfile roasts/nominal_run3_2025_20261027_1809191-df306da/config.yml --profile software/snakemake/profiles/nautilus --jobs 16 --printshellcmds --config roast_id=nominal_run3_2025_20261027_1809191-df306da eos_prod=root://cmseos.fnal.gov//store/user/jda102/HH4b_prod web_prod=root://eosuser.cern.ch//eos/user/j/johnda/www/HH4b/prod 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          echo "$RC" > "$EXIT"
          echo "=== roast nominal_run3_2025_20261027_1809191-df306da step D exit $RC $(date) ===" | tee -a "$LOG"
          exit $RC
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "2"
            memory: "4Gi"
        volumeMounts:
        - mountPath: /workspace
          name: ceph-storage
      volumes:
      - name: ceph-storage
        persistentVolumeClaim:
          claimName: cms-cmu-storage
