apiVersion: batch/v1
kind: Job
metadata:
  name: roast-tthbb-bkg-syst-sob100-cosine-nofine-74d051-bkg-c
  namespace: cms-cmu
  labels:
    roast: "ttHbb_bkg_syst_sob100_cosine_nofinetune_kvgate_202-74d0515d78b4"
    step: "BKG_C"
    app: "roast-runner"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        roast: "ttHbb_bkg_syst_sob100_cosine_nofinetune_kvgate_202-74d0515d78b4"
        step: "BKG_C"
    spec:
      restartPolicy: Never
      serviceAccountName: roast-runner
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - tu.gp-engine.greatplains.net
                - k8s-chase-ci-03.calit2.optiputer.net
      containers:
      - name: orchestrator
        image: docker.io/snakemake/snakemake:v9.27.0
        imagePullPolicy: IfNotPresent
        workingDir: /workspace/users/algomez/prod/ttHbb_bkg_syst_sob100_cosine_nofinetune_kvgate_20261118_c68c7ca-45ef731/barista
        command: ["bash", "-c"]
        args:
        - |
          set -e
          echo "=== roast ttHbb_bkg_syst_sob100_cosine_nofinetune_kvgate_20261118_c68c7ca-45ef731 step BKG_C start $(date) on nautilus ==="
          pip install --no-cache-dir --quiet snakemake-executor-plugin-cluster-generic fsspec fsspec-xrootd
          mkdir -p /etc/grid-security && ln -sfn /workspace/shared/certificates /etc/grid-security/certificates
          export X509_CERT_DIR=/etc/grid-security/certificates
          if [ -s "$PWD/proxy/x509_proxy" ]; then
              install -m 600 "$PWD/proxy/x509_proxy" /tmp/x509_proxy
              export X509_USER_PROXY=/tmp/x509_proxy
          else
              export X509_USER_PROXY="$PWD/proxy/x509_proxy"
          fi
          export PATH=/workspace/shared/bin:$PATH
          export NAUTILUS_WORKDIR=/workspace/users/algomez/prod/ttHbb_bkg_syst_sob100_cosine_nofinetune_kvgate_20261118_c68c7ca-45ef731/barista
          export NAUTILUS_NAMESPACE=cms-cmu
          export CLASSIFIER_CONFIG_PATHS=coffea4bees
          export ROAST_ID="ttHbb_bkg_syst_sob100_cosine_nofinetune_kvgate_20261118_c68c7ca-45ef731"
          export ROAST_STEP="BKG_C"
          cd /workspace/users/algomez/prod/ttHbb_bkg_syst_sob100_cosine_nofinetune_kvgate_20261118_c68c7ca-45ef731/barista
          mkdir -p logs
          LOG=logs/BKG_C.log
          EXIT=logs/BKG_C.exit
          rm -f "$EXIT"
          rm -rf .snakemake/locks/* 2>/dev/null || true
          mkdir -p .snakemake/locks

          snakemake --rulegraph -s coffea4bees/workflows/Snakefile_bkg_syst_C.smk --configfile roasts/ttHbb_bkg_syst_sob100_cosine_nofinetune_kvgate_20261118_c68c7ca-45ef731/config.yml --profile software/snakemake/profiles/nautilus 2>/dev/null | sed -n '/^digraph /,$p' | dot -Tsvg > "logs/BKG_C_rulegraph.svg" 2>/dev/null || true
          snakemake -s coffea4bees/workflows/Snakefile_bkg_syst_C.smk --configfile roasts/ttHbb_bkg_syst_sob100_cosine_nofinetune_kvgate_20261118_c68c7ca-45ef731/config.yml --profile software/snakemake/profiles/nautilus --jobs 16 --printshellcmds --config roast_id=ttHbb_bkg_syst_sob100_cosine_nofinetune_kvgate_20261118_c68c7ca-45ef731 eos_prod=root://cmseos.fnal.gov//store/user/algomez/ttHbb_prod web_prod=root://eosuser.cern.ch//eos/user/a/algomez/www/ttHbb/prod 2>&1 | tee "$LOG"
          RC=${PIPESTATUS[0]}
          echo "$RC" > "$EXIT"
          if [ "$RC" = "0" ]; then
              snakemake --summary -s coffea4bees/workflows/Snakefile_bkg_syst_C.smk --configfile roasts/ttHbb_bkg_syst_sob100_cosine_nofinetune_kvgate_20261118_c68c7ca-45ef731/config.yml --profile software/snakemake/profiles/nautilus > "logs/BKG_C_summary.txt" 2>/dev/null || true
          fi
          echo "=== roast ttHbb_bkg_syst_sob100_cosine_nofinetune_kvgate_20261118_c68c7ca-45ef731 step BKG_C exit $RC $(date) ===" | tee -a "$LOG"
          exit $RC
        resources:
          limits:
            cpu: "2"
            memory: "4Gi"
          requests:
            cpu: "500m"
            memory: "2Gi"
        volumeMounts:
        - mountPath: /workspace
          name: ceph-storage
      volumes:
      - name: ceph-storage
        persistentVolumeClaim:
          claimName: cms-cmu-storage
