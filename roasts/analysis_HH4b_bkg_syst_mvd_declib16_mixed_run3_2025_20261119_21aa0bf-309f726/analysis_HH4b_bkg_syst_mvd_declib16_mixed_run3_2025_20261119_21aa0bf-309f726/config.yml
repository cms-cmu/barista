# ==============================================================================
# HH4b Run 3 2025 BACKGROUND SYSTEMATIC of the MvD-DECLUSTERED background, on MIXED data
# ==============================================================================
# analysis_HH4b_bkg_syst_mvd_declib16_mixed_run3_2024.yml for 2025: nominal mvd_run3_2025_declib16_warm
# (V.1 inputs mvd_declib16_run3_2025_20261028; library mixeddata_all_declib16_2025 of declib16_run3_2025_20261028),
# eras B01..G11, evaluations split BC/D/E/F/G, HH4b_run3_2025.yml. A_1/A_2 LINKED from the 2025 FvT-on-mixed
# roast (same 16 mixed subsamples): set inputs.upstream_roasts.mixed_bkgsyst to that roast's id.
#
#   bin/roast new --config coffea4bees/workflows/config/analysis_HH4b_bkg_syst_mvd_declib16_mixed_run3_2025.yml \
#       --phases BKG_AB,BKG_C,BKG_C4_MVD,BKG_F --cmslpc --train-on orchard --eval-on orchard
# ==============================================================================
label: HH4b_bkg_syst_mvd_declib16_mixed_run3_2025
output_path: output/{roast_id}/
per_year_jcm: false
unify_background: false
match_closure_normalization: false
fourTag_use_tight: true
publish_base: '{eos_prod}/{roast_id}'
handoff:
  eos_base: '{eos_prod}/{roast_id}/handoff'
channel: HH4b
mix_name: HH4b_bkg_syst_mvd_declib16_mixed_run3_2025
dataset_location: coffea4bees/metadata/datasets/
weights_file: coffea4bees/metadata/weights/weights_HH4b.yml
years:
- '2025'
year_eras:
  '2025':
  - B01
  - B11
  - C01
  - C02
  - C11
  - C12
  - D01
  - D11
  - E01
  - E11
  - F01
  - F02
  - F11
  - F12
  - G01
  - G11
phase_f_output_path: inputs/
phase_f_label: Run3_2025_nominal
ttbar_processes:
- TTTo2L2Nu
- TTToSemiLeptonic
- TTToHadronic
inputs:
