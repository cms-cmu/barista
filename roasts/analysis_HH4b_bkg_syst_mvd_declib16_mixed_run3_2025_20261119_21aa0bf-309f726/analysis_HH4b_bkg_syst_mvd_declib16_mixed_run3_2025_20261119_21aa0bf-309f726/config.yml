- module: ml.DataLoader
  option:
  - optimize_sliceable_dataset: true
  - num_workers: 2
  - batch_eval: 65536
- module: ROOT
  option:
  - friend_allow_missing: false
- module: cms.CollisionData
  option:
  - eras:
      '2025':
      - B01
      - B11
      - C01
      - C02
      - C11
      - C12
      - D01
      - D11
      - E01
      - E11
      - F01
      - F02
      - F11
      - F12
      - G01
      - G11
- module: HCR.InputBranch
  option:
  - feature_ancillary:
    - xW
    - nSelJets
    - xbW
  - mass_regions:
    - SR
    - SB
- module: ml.Training
  option:
  - precision: fp16
fvt_train_workflow:
  main:
    module: train
    option:
    - --max-loaders 2
    - --max-trainers 3
    - --device cuda cpu
  dataset:
  - module: HCR.MvD.TrainBaseline
    option:
    - --metadata {metadata}
    - --max-workers 20
    - --data-source mixed_all mixed
    - --data-mixed-all-name mixeddata_all_declib16_2025
    - --data-mixed-name {mixed_name}
    - --data-mixed-samples {mix}
    - --JCM-weight "source:mixed_all,year:2025" {jcm_2025}@@JCM_weights
    - --friends "" {nominal_ci}@@HCR_input {mixed_ci}@@HCR_input
  model:
  - module: HCR.MvD.baseline.Train
    option:
    - --kfolds 3
    - --kfold-seed MvD random
    - --kfold-seed-offsets 0
    - --training FixedStep
    - epoch: 20
      bs_init: 1024
    - --finetuning FinetuneStep
    - epoch: 1
      bs_init: 16384
  setting:
  - module: IO
    option:
    - output: '{model}'
fvt_eval_workflow:
  main:
    module: evaluate
    option:
    - --max-evaluators 3
    - --device cuda cpu
  dataset:
  - module: HCR.MvD.Eval
    option:
    - --metadata {metadata}
    - --max-workers 8
    - --data-source mixed_all
    - --data-mixed-all-name mixeddata_all_declib16_2025
    - --friends "" {nominal_ci}@@HCR_input
  model:
  - module: HCR.MvD.baseline.Eval
    option:
    - --models
    - Final
    - '{model}/result.json'
  analysis:
  - module: kfold.Merge
    option:
    - --name MvD
    - --step 100000
    - --workers 4
    - --clean
  setting:
  - module: IO
    option:
    - output: '{FvT}'
  - module: ml.DataLoader
    option:
    - num_workers: 8
